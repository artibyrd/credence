name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "credence/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/deploy-backend.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      project_id:
        description: "Google Cloud Project ID"
        required: true
        default: "credence-prod-505902"
      region:
        description: "Google Cloud Region"
        required: true
        default: "us-central1"
      service_name:
        description: "Cloud Run Service Name"
        required: true
        default: "credence-server"
      tier:
        description: "Deployment Configuration Tier (advanced / simple)"
        required: true
        type: choice
        options:
          - advanced
          - simple
        default: "advanced"
      profile:
        description: "Operational Cost Profile (economy / balanced / ultra / free)"
        required: true
        default: "balanced"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-cloud-run:
    name: Build & Deploy Cloud Run Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key)
        if: env.GCP_WIF_PROVIDER == '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_CONFIGURED == 'true'
        uses: google-github-actions/setup-gcloud@v2
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}

      - name: Configure Docker for Google Container Registry
        if: env.GCP_CONFIGURED == 'true'
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Set up Docker Buildx
        if: env.GCP_CONFIGURED == 'true'
        uses: docker/setup-buildx-action@v3
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}

      - name: Build and Push Container Image
        if: env.GCP_CONFIGURED == 'true'
        uses: docker/build-push-action@v5
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || inputs.project_id || 'credence-prod-505902' }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            gcr.io/${{ env.PROJECT_ID }}/credence-server:${{ github.ref_name || github.sha }}
            gcr.io/${{ env.PROJECT_ID }}/credence-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        if: env.GCP_CONFIGURED == 'true'
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || inputs.project_id || 'credence-prod-505902' }}
          REGION: ${{ inputs.region || 'us-central1' }}
          SERVICE: ${{ inputs.service_name || 'credence-server' }}
          TIER: ${{ inputs.tier || 'advanced' }}
          PROFILE: ${{ inputs.profile || 'balanced' }}
        run: |
          ENV_NAME="production"
          if [ "${TIER}" = "simple" ]; then
            ENV_NAME="development"
          fi
          gcloud run deploy "${SERVICE}" \
            --image="gcr.io/${PROJECT_ID}/credence-server:latest" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --memory="1Gi" \
            --cpu="1" \
            --execution-environment="gen2" \
            --cpu-boost \
            --set-env-vars="ENV=${ENV_NAME},CREDENCE_PROFILE=${PROFILE},CREDENCE_BACKUP_BUCKET=${PROJECT_ID}-seeds-nexus,STORAGE_BACKEND=gcs" \
            --allow-unauthenticated

      - name: Verify Live Service Health
        if: env.GCP_CONFIGURED == 'true'
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || inputs.project_id || 'credence-prod-505902' }}
          REGION: ${{ inputs.region || 'us-central1' }}
          SERVICE: ${{ inputs.service_name || 'credence-server' }}
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE}" --region="${REGION}" --project="${PROJECT_ID}" --format="value(status.url)")
          echo "Probing deployed service at: ${SERVICE_URL}"
          curl -f -s "${SERVICE_URL}/health" || curl -f -s "${SERVICE_URL}/api/health" || exit 1
          echo "✅ Cloud Run health check passed!"

      - name: Skip Notice (No GCP Secret Configured in GitHub)
        if: env.GCP_CONFIGURED != 'true'
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
        run: |
          echo "=========================================================================="
          echo "ℹ️  Notice: Google Cloud secrets not configured in GitHub repository secrets."
          echo "   To enable automated GitHub Actions deployment to Cloud Run, configure:"
          echo "     - GCP_WORKLOAD_IDENTITY_PROVIDER (recommended) OR GCP_SA_KEY"
          echo "     - GCP_SERVICE_ACCOUNT"
          echo ""
          echo "   Deployments can be executed immediately by operators using:"
          echo "     just deploy backend"
          echo "=========================================================================="
