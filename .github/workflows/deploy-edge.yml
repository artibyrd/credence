name: Deploy Cloudflare Edge Router & Web Assets

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - ".github/workflows/deploy-edge.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Edge Router & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Edge Router to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          cd web
          wrangler deploy

      - name: Deploy Docs to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git clone --depth 1 https://github.com/artibyrd/credence-docs.git /tmp/credence-docs
          cd /tmp/credence-docs
          wrangler pages deploy . --project-name=credence-docs --branch=main

      - name: Skip Deploy Notice (No Secret Configured)
        if: env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Notice: CLOUDFLARE_API_TOKEN secret is not configured in repository secrets."
          echo "Cloudflare Edge Router deployment can be executed locally using: just deploy-edge"
