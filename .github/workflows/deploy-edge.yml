name: Deploy Cloudflare Edge Router & Web Assets

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-edge.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Edge Router
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Edge Router to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "web"
          command: deploy

      - name: Skip Deploy Notice (No Secret Configured)
        if: env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Notice: CLOUDFLARE_API_TOKEN secret is not configured in repository secrets."
          echo "Cloudflare Edge Router deployment can be executed locally using: just deploy-edge"
