name: Deploy Cloudflare Edge Router & Web Assets

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - ".github/workflows/deploy-edge.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Edge Router & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Edge Router to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          cd web
          wrangler deploy

      - name: Deploy Docs to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git clone --depth 1 https://github.com/artibyrd/credence-docs.git /tmp/credence-docs
          cd /tmp/credence-docs
          npx wrangler pages project create credence-docs --production-branch=main || true
          npx wrangler pages deploy . --project-name=credence-docs --branch=main

      - name: Purge Cloudflare Edge Cache
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== Fetching Cloudflare Zone ID for credence.run ==="
          ZONES_RESP=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=credence.run" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          ZONE_ID=$(echo "${ZONES_RESP}" | jq -r '.result[0].id // empty')
          if [ -n "${ZONE_ID}" ]; then
            echo "Purging Cloudflare edge cache for zone credence.run (${ZONE_ID})..."
            PURGE_RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            echo "Purge response: ${PURGE_RESP}"
            echo "✅ Cloudflare edge cache purged successfully."
          else
            echo "⚠️ Could not retrieve Zone ID for credence.run; skipping cache purge."
          fi

      - name: Skip Deploy Notice (No Secret Configured)
        if: env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Notice: CLOUDFLARE_API_TOKEN secret is not configured in repository secrets."
          echo "Cloudflare Edge Router deployment can be executed locally using: just deploy-edge"
