name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Ruff Check & Format Check
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Mypy Static Type Analysis
        run: poetry run mypy credence tests

  test:
    name: Hermetic Unit & Gauntlet Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Credence Docs (for docs integrity verification)
        uses: actions/checkout@v4
        with:
          repository: artibyrd/credence-docs
          path: ../credence-docs
        continue-on-error: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Run Hermetic Pytest Suite (<20s)
        run: poetry run pytest tests/ -m "unit" --durations=10

      - name: Run Offline Mock E2E Integration Suite
        run: poetry run pytest tests/e2e/test_mock_e2e.py -v

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Init (Hermetic)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

  validate-pr-conventions:
    name: Validate PR & Branch Naming Conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Branch Name & PR Title Format
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking branch name: $HEAD_REF"
          echo "Checking PR title: $PR_TITLE"
          python3 -c '
          import re, sys, os
          branch = os.environ.get("HEAD_REF", "")
          title = os.environ.get("PR_TITLE", "")
          
          # Branch Pattern: release/vX.Y.Z, feat/..., fix/..., docs/..., ci/..., hotfix/...
          branch_pat = r"^(release/v[0-9]+\.[0-9]+\.[0-9]+|(feat|fix|docs|ci|hotfix)/.+)$"
          if not re.match(branch_pat, branch):
              print(f"❌ Error: Branch name \"{branch}\" violates naming conventions.")
              print("   Allowed formats: release/vX.Y.Z, feat/<slug>, fix/<slug>, docs/<slug>, ci/<slug>")
              sys.exit(1)
              
          # PR Title Pattern: [vX.Y.Z] <type>(<scope>): <summary>
          title_pat = r"^(\[v[0-9]+\.[0-9]+\.[0-9]+\] )?(feat|fix|docs|refactor|test|ci|chore|perf)(\((governance|forensics|mesh|crypto|ui|ops)\))?!?: .+$"
          if not re.match(title_pat, title):
              print(f"❌ Error: PR title \"{title}\" violates conventional format.")
              print("   Allowed format: [vX.Y.Z] <type>(<scope>): <imperative summary>")
              print("   Allowed types: feat, fix, docs, refactor, test, ci, chore, perf")
              print("   Allowed scopes: (governance), (forensics), (mesh), (crypto), (ui), (ops)")
              sys.exit(1)
              
          print("✅ Branch name and PR title comply with ecosystem governance standards.")
          '

