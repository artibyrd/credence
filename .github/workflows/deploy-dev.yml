name: Deploy Dev Environment to Google Cloud Run

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      project_id:
        description: "Dev Google Cloud Project ID"
        required: true
        default: "credence-dev-505902"
      region:
        description: "Google Cloud Region"
        required: true
        default: "us-central1"
      service_name:
        description: "Cloud Run Service Name"
        required: true
        default: "credence-dev"
      profile:
        description: "Cost Profile (economy / free)"
        required: true
        default: "economy"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Build & Deploy Dev Cloud Run Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key)
        if: env.GCP_WIF_PROVIDER == '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_CONFIGURED == 'true'
        uses: google-github-actions/setup-gcloud@v2
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}

      - name: Build and Submit Container Image to Dev Project
        if: env.GCP_CONFIGURED == 'true'
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
          PROJECT_ID: ${{ inputs.project_id || 'credence-dev-505902' }}
          SERVICE: ${{ inputs.service_name || 'credence-dev' }}
        run: |
          gcloud builds submit \
            --project="${PROJECT_ID}" \
            --tag="gcr.io/${PROJECT_ID}/${SERVICE}:${{ github.sha }}" \
            --tag="gcr.io/${PROJECT_ID}/${SERVICE}:latest"

      - name: Deploy to Dev Cloud Run (Basic Mode)
        if: env.GCP_CONFIGURED == 'true'
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
          PROJECT_ID: ${{ inputs.project_id || 'credence-dev-505902' }}
          REGION: ${{ inputs.region || 'us-central1' }}
          SERVICE: ${{ inputs.service_name || 'credence-dev' }}
          PROFILE: ${{ inputs.profile || 'economy' }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="gcr.io/${PROJECT_ID}/${SERVICE}:latest" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --memory="512Mi" \
            --cpu="1" \
            --execution-environment="gen2" \
            --cpu-boost \
            --set-env-vars="ENV=development,CREDENCE_PROFILE=${PROFILE}" \
            --allow-unauthenticated

      - name: Verify Live Dev Service Health
        if: env.GCP_CONFIGURED == 'true'
        env:
          GCP_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
          PROJECT_ID: ${{ inputs.project_id || 'credence-dev-505902' }}
          REGION: ${{ inputs.region || 'us-central1' }}
          SERVICE: ${{ inputs.service_name || 'credence-dev' }}
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE}" --region="${REGION}" --project="${PROJECT_ID}" --format="value(status.url)")
          echo "Probing deployed dev service at: ${SERVICE_URL}"
          curl -f -s "${SERVICE_URL}/health" || curl -f -s "${SERVICE_URL}/api/health" || exit 1
          echo "✅ Dev Cloud Run health check passed!"
