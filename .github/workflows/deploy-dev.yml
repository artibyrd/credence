name: Deploy Dev Environment to Google Cloud Run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      project_id:
        description: "Dev Google Cloud Project ID"
        required: true
        default: "credence-dev-495173"
      region:
        description: "Google Cloud Region"
        required: true
        default: "us-central1"
      service_name:
        description: "Cloud Run Service Name"
        required: true
        default: "credence-dev"
      profile:
        description: "Cost Profile (economy / free)"
        required: true
        default: "economy"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Build & Deploy Dev Cloud Run Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key)
        if: env.GCP_WIF_PROVIDER == '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA_KEY: ${{ secrets.GCP_DEV_SA_KEY || secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_DEV_SA_KEY || secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_CONFIGURED == 'true'
        uses: google-github-actions/setup-gcloud@v2
        env:
          GCP_CONFIGURED: ${{ (secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_DEV_SA_KEY || secrets.GCP_SA_KEY) != '' }}

      - name: Configure Docker for Google Container Registry
        if: env.GCP_CONFIGURED == 'true'
        env:
          GCP_CONFIGURED: ${{ (secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_DEV_SA_KEY || secrets.GCP_SA_KEY) != '' }}
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Set up Docker Buildx
        if: env.GCP_CONFIGURED == 'true'
        uses: docker/setup-buildx-action@v3
        env:
          GCP_CONFIGURED: ${{ (secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_DEV_SA_KEY || secrets.GCP_SA_KEY) != '' }}

      - name: Build and Push Container Image to Dev Project
        if: env.GCP_CONFIGURED == 'true'
        env:
          GCP_CONFIGURED: ${{ (secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_DEV_SA_KEY || secrets.GCP_SA_KEY) != '' }}
          PROJECT_ID: ${{ secrets.GCP_DEV_PROJECT_ID || inputs.project_id || 'credence-dev-495173' }}
          SERVICE: ${{ inputs.service_name || 'credence-dev' }}
        run: |
          docker buildx build \
            --file Dockerfile \
            --tag "gcr.io/${PROJECT_ID}/${SERVICE}:${{ github.sha }}" \
            --tag "gcr.io/${PROJECT_ID}/${SERVICE}:latest" \
            --push \
            .

      - name: Deploy to Dev Cloud Run (Basic Mode)
        if: env.GCP_CONFIGURED == 'true'
        env:
          GCP_CONFIGURED: ${{ (secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_DEV_SA_KEY || secrets.GCP_SA_KEY) != '' }}
          PROJECT_ID: ${{ secrets.GCP_DEV_PROJECT_ID || inputs.project_id || 'credence-dev-495173' }}
          REGION: ${{ inputs.region || 'us-central1' }}
          SERVICE: ${{ inputs.service_name || 'credence-dev' }}
          PROFILE: ${{ inputs.profile || 'economy' }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="gcr.io/${PROJECT_ID}/${SERVICE}:latest" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --memory="512Mi" \
            --cpu="1" \
            --execution-environment="gen2" \
            --cpu-boost \
            --set-secrets="GEMINI_API_KEY=credence-gemini-api-key:latest" \
            --set-env-vars="ENV=development,CREDENCE_PROFILE=${PROFILE},CREDENCE_BACKUP_BUCKET=${PROJECT_ID}-seeds-nexus,STORAGE_BACKEND=gcs,CREDENCE_SENTINEL_FEEDS=https://inmaricopa.com/feed/" \
            --allow-unauthenticated

      - name: Verify Live Dev Service Health
        if: env.GCP_CONFIGURED == 'true'
        env:
          GCP_CONFIGURED: ${{ (secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_DEV_SA_KEY || secrets.GCP_SA_KEY) != '' }}
          PROJECT_ID: ${{ secrets.GCP_DEV_PROJECT_ID || inputs.project_id || 'credence-dev-495173' }}
          REGION: ${{ inputs.region || 'us-central1' }}
          SERVICE: ${{ inputs.service_name || 'credence-dev' }}
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE}" --region="${REGION}" --project="${PROJECT_ID}" --format="value(status.url)")
          echo "Probing deployed dev service at: ${SERVICE_URL}"
          curl -f -s "${SERVICE_URL}/health" || curl -f -s "${SERVICE_URL}/api/health" || exit 1
          echo "✅ Dev Cloud Run health check passed!"

      - name: Deploy Edge Router to Cloudflare Workers (Dev Preview Only)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          echo "=== Ensuring dev.docs and dev.blog DNS records exist on zone credence.run ==="
          Z_RESP=$(curl -s --retry 3 --retry-delay 2 -X GET "https://api.cloudflare.com/client/v4/zones?name=credence.run" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" || echo "{}")
          Z_ID=$(echo "$Z_RESP" | jq -r '.result[0].id // empty')
          if [ -n "$Z_ID" ]; then
            for sub in dev.docs dev.blog; do
              RECORD_ID=$(curl -s --retry 3 --retry-delay 2 -X GET "https://api.cloudflare.com/client/v4/zones/${Z_ID}/dns_records?name=${sub}.credence.run" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" | jq -r '.result[0].id // empty')
              if [ -z "$RECORD_ID" ]; then
                echo "Creating proxied DNS record for ${sub}.credence.run..."
                curl -s --retry 3 --retry-delay 2 -X POST "https://api.cloudflare.com/client/v4/zones/${Z_ID}/dns_records" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data "{\"type\":\"CNAME\",\"name\":\"${sub}\",\"content\":\"credence.run\",\"proxied\":true,\"ttl\":1}" || true
              else
                echo "DNS record ${sub}.credence.run already active (${RECORD_ID})."
              fi
            done
          fi

          echo "=== Unassigning any legacy dev routes from other workers ==="
          for domain in credence.run credence.report credence.nexus credence.foundation; do
            Z_RESP=$(curl -s --retry 3 --retry-delay 2 -X GET "https://api.cloudflare.com/client/v4/zones?name=${domain}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" || echo "{}")
            Z_ID=$(echo "$Z_RESP" | jq -r '.result[0].id // empty')
            if [ -n "$Z_ID" ]; then
              ROUTES_RESP=$(curl -s --retry 3 --retry-delay 2 -X GET "https://api.cloudflare.com/client/v4/zones/${Z_ID}/workers/routes" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" || echo "{}")
              for route_id in $(echo "$ROUTES_RESP" | jq -r '.result[]? | select((.pattern | startswith("dev.") or startswith("mcp.dev.")) and .script != "credence-dev") | .id // empty'); do
                echo "Releasing conflicting dev route $route_id from zone ${domain}..."
                curl -s --retry 3 --retry-delay 2 -X DELETE "https://api.cloudflare.com/client/v4/zones/${Z_ID}/workers/routes/${route_id}" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" || true
              done
            fi
          done
          cd web
          wrangler deploy --env dev
          echo "=== Deploying Docs to Cloudflare Pages (Dev Preview Branch) ==="
          git clone --depth=1 --branch="${{ github.head_ref || github.ref_name || 'main' }}" "https://github.com/artibyrd/credence-docs.git" /tmp/credence-docs || git clone --depth=1 "https://github.com/artibyrd/credence-docs.git" /tmp/credence-docs
          (cd /tmp/credence-docs && rm -f _worker.js wrangler.toml && wrangler pages deploy . --project-name=credence-docs --branch=dev --commit-dirty=true)
          echo "=== Purging Cloudflare Edge Cache for Dev Preview Subdomains ==="
          for domain in credence.run credence.report credence.nexus credence.foundation; do
            Z_RESP=$(curl -s --retry 3 --retry-delay 2 -X GET "https://api.cloudflare.com/client/v4/zones?name=${domain}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" || echo "{}")
            Z_ID=$(echo "$Z_RESP" | jq -r '.result[0].id // empty')
            if [ -n "$Z_ID" ]; then
              curl -s --retry 3 --retry-delay 2 -X POST "https://api.cloudflare.com/client/v4/zones/${Z_ID}/purge_cache" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"hosts\":[\"dev.${domain}\",\"dev.admin.${domain}\",\"dev.seeds.${domain}\",\"dev.keys.${domain}\",\"dev.docs.${domain}\",\"dev.blog.${domain}\",\"mcp.dev.${domain}\"]}" || true
              echo "✅ Dev Edge Cache Purged for dev.${domain}!"
            fi
          done

      - name: Skip Notice (No GCP Secret Configured in GitHub)
        if: env.GCP_CONFIGURED != 'true'
        env:
          GCP_CONFIGURED: ${{ (secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_DEV_SA_KEY || secrets.GCP_SA_KEY) != '' }}
        run: |
          echo "=========================================================================="
          echo "ℹ️  Notice: Dev Google Cloud secrets not configured in GitHub repository secrets."
          echo "   To enable automated GitHub Actions deployment to Dev Cloud Run, configure:"
          echo "     - GCP_DEV_WORKLOAD_IDENTITY_PROVIDER (recommended) OR GCP_DEV_SA_KEY"
          echo "     - GCP_DEV_SERVICE_ACCOUNT"
          echo "     - GCP_DEV_PROJECT_ID"
          echo "=========================================================================="

