# ==============================================================================
# Credence Sovereign Node: Kubernetes Deployment & Service Manifest
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credence-server
  labels:
    app.kubernetes.io/name: credence
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: credence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: credence
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: credence
          image: gcr.io/credence-prod-505902/credence-server:latest
          command: ["credence", "serve", "--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENV
              value: "production"
            - name: CREDENCE_PROFILE
              value: "balanced"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: credence-secrets
                  key: database-url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: credence-secrets
                  key: redis-url
                  optional: true
            - name: CREDENCE_GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: credence-secrets
                  key: gemini-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: credence-service
  labels:
    app.kubernetes.io/name: credence
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: credence
