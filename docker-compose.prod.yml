# ==============================================================================
# Credence Planetary Cluster: 1-Command Production Self-Hosted Deployment
# ==============================================================================
# Full stack simulation: Credence + PostgreSQL 16 + MinIO S3 + Valkey (Redis)
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: credence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: credence
      POSTGRES_USER: credence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credence_secret_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credence -d credence"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: credence-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-credence_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-credence_minio_secret}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  valkey:
    image: valkey/valkey:8-alpine
    container_name: credence-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  credence:
    image: gcr.io/credence-prod-505902/credence-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credence-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - CREDENCE_PROFILE=balanced
      - DATABASE_URL=postgresql+asyncpg://credence:${POSTGRES_PASSWORD:-credence_secret_password}@postgres:5432/credence
      - STORAGE_BACKEND=s3
      - S3_BUCKET_NAME=credence-snapshots
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-credence_minio_admin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-credence_minio_secret}
      - REDIS_URL=redis://valkey:6379/0
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - CREDENCE_BACKUP_ENABLED=true
      - CREDENCE_BACKUP_DIR=/data/backups
      - CREDENCE_BOREDOM_ENABLED=true
      - CREDENCE_SIFTER_ENABLED=true
      - CREDENCE_GEMINI_API_KEY=${CREDENCE_GEMINI_API_KEY:-}
      - CREDENCE_ADMIN_API_KEY=${CREDENCE_ADMIN_API_KEY:-admin_secret_token}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
  valkey-data:
    driver: local
