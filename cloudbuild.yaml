steps:
  # Step 1: Quality Gate (Ruff Lint & Mypy Type Checks) - Runs in parallel with tests
  - name: 'python:3.12-slim'
    id: 'quality-gate'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir poetry
        poetry install --no-root
        poetry run ruff check .
        poetry run ruff format --check .
        poetry run mypy credence tests

  # Step 2: Hermetic Test Gate (All unit tests must pass in parallel) - Runs in parallel with quality gate
  - name: 'python:3.12-slim'
    id: 'test-gate'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir poetry
        poetry install --no-root
        poetry run pytest tests/ -m "not integration and not e2e" -n auto --durations=10

  # Step 3: Container Build with Docker BuildKit & Cache
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    waitFor: ['quality-gate', 'test-gate']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_IMAGE}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_IMAGE}:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/${_IMAGE}:latest'
      - '.'

  # Step 4: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-push'
    waitFor: ['docker-build']
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/${_IMAGE}'

  # Step 5: Zero-Downtime Deployment to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'cloud-run-deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_IMAGE}:$COMMIT_SHA'
      - '--region=${_LOCATION}'
      - '--platform=managed'
      - '--allow-unauthenticated'

  # Step 6: Post-Deployment Health Check Probe
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'health-check-probe'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SERVICE_URL=$(gcloud run services describe "${_SERVICE_NAME}" --region="${_LOCATION}" --format="value(status.url)")
        echo "Probing service health at: $SERVICE_URL"
        curl -f -s "$SERVICE_URL/health" || curl -f -s "$SERVICE_URL/api/health" || exit 1
        echo "✅ Post-deployment health check passed!"

substitutions:
  _LOCATION: 'us-central1'
  _IMAGE: 'credence-server'
  _SERVICE_NAME: 'credence-server'

options:
  logging: CLOUD_LOGGING_ONLY
