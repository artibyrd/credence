services:
  credence-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credence-node-1
    command: ["poetry", "run", "credence", "serve", "--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
      - "8761:8765"
    environment:
      - ENV=cluster
      - CREDENCE_PROFILE=ultra
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/credence.db
      - DATABASE_URL=sqlite+aiosqlite:////app/data/credence.db
      - NODE_KEY_PATH=/app/data/node_identity.key
      - MESH_ENABLED=true
      - MESH_HOST=0.0.0.0
      - MESH_PORT=8765
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - PEER_SEEDS=ws://credence-node-2:8765,ws://credence-node-5:8765,ws://credence-node-13:8765
    volumes:
      - ./data/cluster/node1:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
    networks:
      - credence-mesh-net

