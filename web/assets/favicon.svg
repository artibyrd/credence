<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Outline with Vibrant Cyan Gradient Glow -->
  <path d="M 50 3 L 88 20 L 88 52 C 88 78 50 97 50 97 C 50 97 12 78 12 52 L 12 20 Z" 
        fill="url(#cyanGlow)" 
        filter="url(#glow)" />

  <!-- Inner Dark Obsidian Shield Body -->
  <path d="M 50 11 L 79 24 L 79 51 C 79 72 50 88 50 88 C 50 88 21 72 21 51 L 21 24 Z" 
        fill="url(#shieldBg)" 
        stroke="rgba(56, 189, 248, 0.35)" 
        stroke-width="1.5" />

  <!-- Crisp Verification Checkmark -->
  <path d="M 38 48 L 47 57 L 65 37" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>