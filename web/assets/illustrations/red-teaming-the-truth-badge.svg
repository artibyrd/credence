<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="880" height="400" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <text x="32" y="32" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold" letter-spacing="0.1em">CRYPTOGRAPHIC ANTI-TAMPER PROOF</text>
  <text x="32" y="56" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">RED-TEAMING THE TRUTH BADGE: BAIT-AND-SWITCH ATTACK DETECTION</text>

  <!-- Step 1: Honest Audit -->
  <rect x="32" y="80" width="250" height="280" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" />
  <rect x="32" y="80" width="250" height="28" rx="10" fill="rgba(34, 197, 94, 0.15)" />
  <text x="48" y="99" fill="#22c55e" font-size="11" font-family="monospace" font-weight="bold">1. HONEST AUDIT</text>
  <text x="48" y="130" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Clean Article Published</text>
  <text x="48" y="152" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Credence audits DOM text</text>
  <text x="48" y="172" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Signs Ed25519 receipt</text>
  <text x="48" y="192" fill="#38bdf8" font-size="10.5" font-family="monospace">SHA-256: 0xa1b2c3...</text>
  <rect x="44" y="240" width="226" height="50" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.0" />
  <text x="56" y="270" fill="#86efac" font-size="11" font-family="monospace" font-weight="bold">STATUS: PRISTINE (0.0)</text>

  <!-- Step 2: Publisher Mutates Text -->
  <rect x="315" y="80" width="250" height="280" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" filter="url(#card-shadow)" />
  <rect x="315" y="80" width="250" height="28" rx="10" fill="rgba(239, 68, 68, 0.15)" />
  <text x="331" y="99" fill="#ef4444" font-size="11" font-family="monospace" font-weight="bold">2. CMS TAMPERING</text>
  <text x="331" y="130" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Bait-and-Switch Mutation</text>
  <text x="331" y="152" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Author edits CMS body</text>
  <text x="331" y="172" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Injects ungrounded claim</text>
  <text x="331" y="192" fill="#ef4444" font-size="10.5" font-family="monospace">SHA-256: 0xf9e8d7...</text>
  <rect x="327" y="240" width="226" height="50" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.0" />
  <text x="339" y="270" fill="#fca5a5" font-size="11" font-family="monospace" font-weight="bold">SILENT DOM MUTATION</text>

  <!-- Step 3: WebCrypto Anti-Tamper Trigger -->
  <rect x="598" y="80" width="250" height="280" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" filter="url(#card-shadow)" />
  <rect x="598" y="80" width="250" height="28" rx="10" fill="rgba(168, 85, 247, 0.15)" />
  <text x="614" y="99" fill="#a855f7" font-size="11" font-family="monospace" font-weight="bold">3. CLIENT-SIDE CUSTODY</text>
  <text x="614" y="130" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Native WebCrypto Verification</text>
  <text x="614" y="152" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Badge hashes current DOM</text>
  <text x="614" y="172" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Compares to signed receipt</text>
  <text x="614" y="192" fill="#fca5a5" font-size="10.5" font-family="monospace">0xf9e8d7 != 0xa1b2c3</text>
  <rect x="610" y="240" width="226" height="50" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1.2" />
  <text x="622" y="270" fill="#d8b4fe" font-size="11" font-family="monospace" font-weight="bold">🚨 BADGE FLASHES TAMPERED</text>

  <!-- Connector Arrows -->
  <line x1="282" y1="200" x2="310" y2="200" stroke="#38bdf8" stroke-width="2.0" marker-end="url(#arrow-sky)" />
  <line x1="565" y1="200" x2="593" y2="200" stroke="#ef4444" stroke-width="2.0" marker-end="url(#arrow-red)" />
</svg>
