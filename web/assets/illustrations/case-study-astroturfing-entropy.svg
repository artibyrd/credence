l="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Automated 50% score slash applied</text><text x="56" y="283" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Identified entities flagged in forensic audit</text><rect x="448" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#22c55e" stroke-width="1.1" /><text x="464" y="88" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">ORGANIC CIVIC DISCOURSE (H &gt; 0.70)</text><rect x="462" y="96" width="356" height="96" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="462" y="96" width="356" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="476" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">👥</text><text x="500" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">High Lexical Diversity</text><text x="476" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Rich vocabulary variance and natural phrasing</text><text x="476" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Diverse independent perspectives and timing</text><text x="476" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Authentic citizen engagement indicators</text><rect x="462" y="204" width="356" height="114" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="462" y="204" width="356" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.2" /><text x="476" y="227" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚖️</text><text x="500" y="227" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Galileo Minority Override</text><text x="476" y="247" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Protects lone factual whistleblowers</text><text x="476" y="265" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Prevents majority consensus suppression</text><text x="476" y="283" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verified through primary source citations</text><line x1="412" y1="144" x2="448" y2="144" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow-emerald)" />
