<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" letter-spacing="0.1em">INFRASTRUCTURE PLANE TOPOLOGY</text>
  <text x="28" y="48" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="bold">THE 3-PLANE ARCHITECTURE: ZERO-NPM EDGE, SCALE-TO-ZERO COMPUTE, AND SOVEREIGN INFRA</text>

  <!-- Elements -->
  <rect x="28" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#38bdf8" stroke-width="1.0" /><text x="42" y="86" fill="#38bdf8" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">EDGE PLANE (CLOUDFLARE)</text><rect x="40" y="94" width="220" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="40" y="94" width="220" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="54" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🌐</text><text x="76" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Zero-Build Web UI</text><text x="54" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Vanilla HTML5 / ES Modules</text><text x="54" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Zero npm dependencies</text><rect x="40" y="174" width="220" height="70" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="40" y="174" width="220" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.0" /><text x="54" y="196" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">📘</text><text x="76" y="196" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Interactive Docs</text><text x="54" y="216" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• docs.credence.run</text><text x="54" y="233" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Fast client search index</text><rect x="40" y="254" width="220" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="40" y="254" width="220" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="54" y="276" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">⚡</text><text x="76" y="276" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Edge Router (_worker.js)</text><text x="54" y="296" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Multi-domain routing</text><text x="54" y="313" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Tiered CDN cache headers</text><rect x="298" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#22c55e" stroke-width="1.0" /><text x="312" y="86" fill="#22c55e" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">COMPUTE PLANE (CLOUD RUN)</text><rect x="310" y="94" width="220" height="70" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="310" y="94" width="220" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="324" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">⚙️</text><text x="346" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">FastMCP 2.0 Engine</text><text x="324" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Stdio &amp; SSE Transports</text><text x="324" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Automated tools &amp; resources</text><rect x="310" y="174" width="220" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="310" y="174" width="220" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="324" y="196" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🚀</text><text x="346" y="196" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Starlette Core Server</text><text x="324" y="216" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Ingestion &amp; Scrubber API</text><text x="324" y="233" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Rate limiting &amp; Prometheus</text><rect x="310" y="254" width="220" height="70" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="310" y="254" width="220" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.0" /><text x="324" y="276" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">💾</text><text x="346" y="276" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">SQLite + Vector Store</text><text x="324" y="296" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Relational audit logs</text><text x="324" y="313" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Vector embeddings (WAL)</text><rect x="568" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#a855f7" stroke-width="1.0" /><text x="582" y="86" fill="#a855f7" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">INFRA PLANE (MULTI-CLOUD)</text><rect x="580" y="94" width="220" height="70" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="580" y="94" width="220" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.0" /><text x="594" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🏛️</text><text x="616" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Terraform HCL</text><text x="594" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• GCP Cloud Run + WIF</text><text x="594" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cloudflare DNS &amp; Pages</text><rect x="580" y="174" width="220" height="70" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="580" y="174" width="220" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.0" /><text x="594" y="196" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🔄</text><text x="616" y="196" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">GitHub Actions CI/CD</text><text x="594" y="216" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Keyless WIF deploy</text><text x="594" y="233" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Automated dev staging</text><rect x="580" y="254" width="220" height="70" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="580" y="254" width="220" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="594" y="276" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🔐</text><text x="616" y="276" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Genesis Key Custody</text><text x="594" y="296" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• RFC 8785 Canonical JSON</text><text x="594" y="313" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Ed25519 root authority</text><line x1="272" y1="129" x2="298" y2="129" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arrow-cyan)" /><text x="285.0" y="123.0" fill="#94a3b8" font-size="9" font-family="monospace" font-weight="normal" text-anchor="middle">API / SSE</text><line x1="542" y1="129" x2="568" y2="129" stroke="#22c55e" stroke-width="1.4" marker-end="url(#arrow-emerald)" /><text x="555.0" y="123.0" fill="#94a3b8" font-size="9" font-family="monospace" font-weight="normal" text-anchor="middle">WIF Auth</text>
</svg>
