ke-width="1.2" /><text x="464" y="97.5" fill="#a855f7" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">3</text><text x="482" y="97.5" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">DOM Scrubber</text><text x="458" y="118" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Strip scripts &amp; entities</text><line x1="624" y1="120.0" x2="652" y2="120.0" stroke="#a855f7" stroke-width="1.4" marker-end="url(#arrow-purple)" /><rect x="652" y="70" width="180" height="100" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="652" y="70" width="180" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><circle cx="672" cy="94" r="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.2" /><text x="672" y="97.5" fill="#22c55e" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">4</text><text x="690" y="97.5" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Attestation</text><text x="666" y="118" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">RFC 8785 Ed25519 sign</text><rect x="28" y="188" width="804" height="146" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="28" y="188" width="804" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="42" y="210" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="64" y="210" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Epistemic Security &amp; Untrusted Ingestion Boundary</text><text x="42" y="230" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">Citations match source text character-for-character (G=1.00). Cloud m