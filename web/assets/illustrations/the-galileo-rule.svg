<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header Bar -->
  <text x="24" y="28" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" letter-spacing="0.1em">EPISTEMIC LENSING</text>
  <text x="24" y="46" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="bold" letter-spacing="0.01em">THE GALILEO RULE: ASYMMETRIC GROUNDED EVIDENCE</text>

  <!-- Elements -->
  <rect x="260" y="65" width="340" height="70" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="260" y="65" width="340" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="272" y="86" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">⚡</text><text x="294" y="86" fill="#f8fafc" font-size="12.5" font-family="sans-serif" font-weight="600" text-anchor="start">1. SURFACE LENS (Glance)</text><rect x="536.0" y="73" width="54.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#22c55e" stroke-width="0.8" /><text x="563.0" y="85.5" fill="#22c55e" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="middle">Tier 1</text><text x="272" y="105" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Overall Credence score gauge (0-100)</text><text x="272" y="120" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Quick verified / suspicious badge</text><rect x="160" y="155" width="540" height="75" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="160" y="155" width="540" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="172" y="176" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🔍</text><text x="194" y="176" fill="#f8fafc" font-size="12.5" font-family="sans-serif" font-weight="600" text-anchor="start">2. FOCUS LENS (Explore)</text><rect x="636.0" y="163" width="54.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="0.8" /><text x="663.0" y="175.5" fill="#38bdf8" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="middle">Tier 2</text><text x="172" y="195" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Deconstructed claims &amp; deceptive pattern tags</text><text x="172" y="210" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verbatim DOM citations (G=1.00) &amp; sparklines</text><rect x="60" y="250" width="740" height="80" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="60" y="250" width="740" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.0" /><text x="72" y="271" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🔬</text><text x="94" y="271" fill="#f8fafc" font-size="12.5" font-family="sans-serif" font-weight="600" text-anchor="start">3. DEEP SPECTRUM LENS (Foren</text><rect x="736.0" y="258" width="54.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#a855f7" stroke-width="0.8" /><text x="763.0" y="270.5" fill="#a855f7" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="middle">Tier 3</text><text x="72" y="290" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cryptographic Ed25519 signatures &amp; RFC 8785 ca</text><text x="72" y="305" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Raw DOM SHA-256 hash &amp; full temporal diff time</text><line x1="430" y1="135" x2="430" y2="155" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arrow-cyan)" /><line x1="430" y1="230" x2="430" y2="250" stroke="#a855f7" stroke-width="1.4" marker-end="url(#arrow-purple)" />
</svg>
