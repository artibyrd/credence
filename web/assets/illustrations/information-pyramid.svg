<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="rose-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Drop Shadow & Glow Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Directional Arrow Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Canvas Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Canvas Header -->
  <text x="24" y="32" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="bold" letter-spacing="0.02em">THE EPISTEMIC LENSING &amp; INFORMATION PYRAMID</text>

  <!-- Canvas Elements -->
  <rect x="260" y="60" width="340" height="75" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" filter="url(#card-shadow)" /><rect x="260" y="60" width="340" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="274" y="82" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚡</text><text x="298" y="82" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="600" text-anchor="start">1. SURFACE LENS (Glance)</text><rect x="529.0" y="70" width="59.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#22c55e" stroke-width="0.8" /><text x="558.5" y="83" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">Tier 1</text><text x="274" y="102" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Overall Credence score gauge (0-100)</text><text x="274" y="118" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Quick verified / suspicious badge</text><rect x="160" y="155" width="540" height="75" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)" /><rect x="160" y="155" width="540" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="174" y="177" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔍</text><text x="198" y="177" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="600" text-anchor="start">2. FOCUS LENS (Explore)</text><rect x="629.0" y="165" width="59.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="0.8" /><text x="658.5" y="178" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">Tier 2</text><text x="174" y="197" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Deconstructed claims &amp; deceptive pattern tags</text><text x="174" y="213" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verbatim DOM citations &amp; sparklines</text><rect x="60" y="250" width="740" height="75" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" filter="url(#card-shadow)" /><rect x="60" y="250" width="740" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.0" /><text x="74" y="272" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔬</text><text x="98" y="272" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="600" text-anchor="start">3. DEEP SPECTRUM LENS (Forensic Audit)</text><rect x="729.0" y="260" width="59.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#a855f7" stroke-width="0.8" /><text x="758.5" y="273" fill="#a855f7" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">Tier 3</text><text x="74" y="292" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cryptographic Ed25519 signatures, RFC 8785 canonical envelopes, raw DOM hash, full timeline</text><line x1="430" y1="135" x2="430" y2="155" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)" /><rect x="392.5" y="129.0" width="75.0" height="16" rx="3" fill="#090d16" stroke="#38bdf8" stroke-width="0.7" /><text x="430.0" y="141.0" fill="#cbd5e1" font-size="9.5" font-family="monospace" font-weight="normal" text-anchor="middle">Drill down</text><line x1="430" y1="230" x2="430" y2="250" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-cyan)" /><rect x="373.0" y="224.0" width="114.0" height="16" rx="3" fill="#090d16" stroke="#a855f7" stroke-width="0.7" /><text x="430.0" y="236.0" fill="#cbd5e1" font-size="9.5" font-family="monospace" font-weight="normal" text-anchor="middle">Forensic inspect</text>
</svg>
