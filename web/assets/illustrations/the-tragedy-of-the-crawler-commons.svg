<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="bold" letter-spacing="0.1em">WEB ETHICS &amp; AGENTIC CITIZENSHIP</text>
  <text x="28" y="50" fill="#f8fafc" font-size="14.5" font-family="sans-serif" font-weight="bold">THE TRAGEDY OF THE CRAWLER COMMONS &amp; BOT RECIPROCITY</text>

  <!-- Left Box: Predatory Scraping -->
  <rect x="28" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#ef4444" stroke-width="1.1" stroke-dasharray="4 4" />
  <text x="44" y="88" fill="#ef4444" font-size="10" font-family="monospace" font-weight="bold">PREDATORY EXTRACTION COMMONS</text>
  <rect x="42" y="96" width="356" height="106" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.3" filter="url(#card-shadow)" />
  <rect x="42" y="96" width="356" height="3" rx="1.5" fill="#ef4444" />
  <text x="56" y="119" fill="#f8fafc" font-size="15">🌪️</text>
  <text x="80" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">Unbounded Asymmetric Crawls</text>
  <text x="56" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif">• Disregard of robots.txt and Crawl-delay headers</text>
  <text x="56" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif">• Exhausts origin server CPU and egress bandwidth</text>
  <text x="56" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif">• Forces webmasters behind commercial paywalls</text>

  <rect x="42" y="214" width="356" height="106" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3" filter="url(#card-shadow)" />
  <rect x="42" y="214" width="356" height="3" rx="1.5" fill="#f59e0b" />
  <text x="56" y="237" fill="#f8fafc" font-size="15">🚫</text>
  <text x="80" y="237" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">Zero Reciprocity &amp; Value Stripping</text>
  <text x="56" y="257" fill="#94a3b8" font-size="11" font-family="sans-serif">• Extracts independent creators' data without credit</text>
  <text x="56" y="275" fill="#94a3b8" font-size="11" font-family="sans-serif">• Feeds private LLM silos with zero attribution</text>
  <text x="56" y="293" fill="#94a3b8" font-size="11" font-family="sans-serif">• Degrades open web commons into digital wasteland</text>

  <!-- Right Box: Sovereign Agentic Citizenship -->
  <rect x="448" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#38bdf8" stroke-width="1.1" />
  <text x="464" y="88" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold">SOVEREIGN AGENTIC CITIZENSHIP</text>
  <rect x="462" y="96" width="356" height="106" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" filter="url(#card-shadow)" />
  <rect x="462" y="96" width="356" height="3" rx="1.5" fill="#38bdf8" />
  <text x="476" y="119" fill="#f8fafc" font-size="15">🤝</text>
  <text x="500" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">Polite P2P Gossip &amp; Cache Sharing</text>
  <text x="476" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif">• Highest Random Weight (HRW) feed rendezvous</text>
  <text x="476" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif">• One node scrapes, 100+ peer nodes receive cache</text>
  <text x="476" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif">• Respectful exponential backoff and polite pacing</text>

  <rect x="462" y="214" width="356" height="106" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" />
  <rect x="462" y="214" width="356" height="3" rx="1.5" fill="#22c55e" />
  <text x="476" y="237" fill="#f8fafc" font-size="15">🎖️</text>
  <text x="500" y="237" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">Cryptographic Attribution &amp; Merit</text>
  <text x="476" y="257" fill="#94a3b8" font-size="11" font-family="sans-serif">• Verifiable Ed25519 attribution on all source data</text>
  <text x="476" y="275" fill="#94a3b8" font-size="11" font-family="sans-serif">• Structured FastMCP endpoints replace brute scrapes</text>
  <text x="476" y="293" fill="#94a3b8" font-size="11" font-family="sans-serif">• Mutualistic symbiosis between agents and publishers</text>

  <!-- Flow Connector -->
  <line x1="412" y1="200" x2="448" y2="200" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-cyan)" />
</svg>
