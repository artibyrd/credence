  <text x="47" y="162" fill="#cbd5e1" font-size="10" font-family="sans-serif">Checks Edge Cache Hit</text>
  <rect x="45" y="214" width="205" height="18" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
