  <text x="571" y="132" fill="#22c55e" font-size="8" font-family="monospace" text-anchor="middle">Lease</text>
  
  <line x1="600" y1="188" x2="542" y2="188" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)" />
  <text x="571" y="180" fill="#38bdf8" font-size="8" font-family="monospace" text-anchor="middle">Attest</text>
