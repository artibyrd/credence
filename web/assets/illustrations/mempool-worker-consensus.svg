  <rect x="600" y="84" width="225" height="3" rx="1.5" fill="#22c55e" stroke="none" />
  <text x="612" y="106" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold">VOLUNTEER FLEET</text>
