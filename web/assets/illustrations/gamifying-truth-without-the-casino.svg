<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>
  <rect width="860" height="280" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />
  <text x="32" y="28" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" letter-spacing="0.1em">PEER REPUTATION</text>
  <text x="32" y="49" fill="#ffffff" font-size="14" font-family="sans-serif" font-weight="bold">PEER QUALITY &amp; TRAFFIC TIERS</text>
  <rect x="35" y="84" width="235" height="160" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="35" y="84" width="235" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.2" /><text x="47" y="105" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="normal" text-anchor="start">📊</text><text x="67" y="105" fill="#ffffff" font-size="11.5" font-family="sans-serif" font-weight="bold" text-anchor="start">Trust Scoring</text><text x="47" y="122" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Evaluates node uptime</text><text x="47" y="136" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Measures citation accuracy</text><text x="47" y="150" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Scores peer reliability</text><rect x="45" y="224" width="215" height="15" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" /><text x="152.5" y="235" fill="#ffffff" font-size="8.5" font-family="monospace" font-weight="bold" text-anchor="middle">Reputation Score</text><rect x="312" y="84" width="235" height="160" rx="8" fill="#111827" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="312" y="84" width="235" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="324" y="105" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="normal" text-anchor="start">🏅</text><text x="344" y="105" fill="#ffffff" font-size="11.5" font-family="sans-serif" font-weight="bold" text-anchor="start">Priority Tiers</text><text x="324" y="122" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Tier 1: High priority tasks</text><text x="324" y="136" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Tier 2: Standard sharing</text><text x="324" y="150" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Tier 3: Probation status</text><rect x="322" y="224" width="215" height="15" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="0.8" /><text x="429.5" y="235" fill="#ffffff" font-size="8.5" font-family="monospace" font-weight="bold" text-anchor="middle">Task Allocation</text><rect x="590" y="84" width="235" height="160" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="590" y="84" width="235" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.2" /><text x="602" y="105" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="normal" text-anchor="start">🛑</text><text x="622" y="105" fill="#ffffff" font-size="11.5" font-family="sans-serif" font-weight="bold" text-anchor="start">Rogue Isolation</text><text x="602" y="122" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Low-scoring nodes isolated</text><text x="602" y="136" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Relay rights revoked</text><text x="602" y="150" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Protects network consensus</text><rect x="600" y="224" width="215" height="15" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="0.8" /><text x="707.5" y="235" fill="#ffffff" font-size="8.5" font-family="monospace" font-weight="bold" text-anchor="middle">Rogue Quarantine</text><line x1="270" y1="164" x2="312" y2="164" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-emerald)" /><line x1="547" y1="164" x2="590" y2="164" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-rose)" />
</svg>
