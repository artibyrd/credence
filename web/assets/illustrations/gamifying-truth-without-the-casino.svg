<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>
  <rect width="860" height="280" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />
  <text x="32" y="30" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" letter-spacing="0.1em">PEER MERIT</text>
  <text x="32" y="52" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="bold">5-FACTOR PEER QUALITY &amp; TRAFFIC TIERS</text>
  <rect x="36" y="88" width="230" height="156" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="36" y="88" width="230" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.2" /><text x="48" y="109" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">📊</text><text x="70" y="109" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">5-Factor Formula</text><text x="48" y="126" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Qi = 0.25U + 0.30C + 0.25G</text><text x="48" y="141" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Plus 0.10T + 0.10K Factors</text><text x="48" y="156" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Evaluates Reliability</text><rect x="48" y="222" width="206" height="16" rx="4" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.0" /><text x="151.0" y="234" fill="#38bdf8" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">Reputation Formula</text><rect x="315" y="88" width="230" height="156" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="315" y="88" width="230" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="327" y="109" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🏅</text><text x="349" y="109" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Merit Tiers</text><text x="327" y="126" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Tier 1: High Priority</text><text x="327" y="141" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Tier 2: Standard Relay</text><text x="327" y="156" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Tier 3: Probation Tier</text><rect x="327" y="222" width="206" height="16" rx="4" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.0" /><text x="430.0" y="234" fill="#22c55e" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">Bandwidth Priority</text><rect x="594" y="88" width="230" height="156" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="594" y="88" width="230" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.2" /><text x="606" y="109" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🛑</text><text x="628" y="109" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Quarantine Gate</text><text x="606" y="126" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Scores &lt; 0.30 Isolated</text><text x="606" y="141" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Zero Gossip Relay Rights</text><text x="606" y="156" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Protects Quorum</text><rect x="606" y="222" width="206" height="16" rx="4" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.0" /><text x="709.0" y="234" fill="#ef4444" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">Sybil Quarantine</text><line x1="266" y1="166" x2="315" y2="166" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-emerald)" /><line x1="545" y1="166" x2="594" y2="166" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-rose)" />
</svg>
