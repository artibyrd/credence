" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.2" /><text x="56" y="197" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔬</text><text x="80" y="197" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Node 2 (Auditor)</text><text x="56" y="217" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">M=0.88 | Active</text><text x="56" y="235" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">Heuristic Verifier</text><rect x="234" y="174" width="164" height="66" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="234" y="174" width="164" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.2" /><text x="248" y="197" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔍</text><text x="272" y="197" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Node 3 (Sifter)</text><text x="248" y="217" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">M=0.85 | Active</text><text x="248" y="235" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">Boredom Sifter</text><rect x="138" y="252" width="164" height="66" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="138" y="252" width="164" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.2" /><text x="152" y="275" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">📰</text><text x="176" y="275" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Node 4 (Digest)</text><text x="152" y="295" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anc