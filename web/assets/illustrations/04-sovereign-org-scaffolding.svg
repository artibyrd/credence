0" y="120.0" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Expert Peer Verifier</text><text x="326" y="142.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Specialized domain knowledge</text><text x="326" y="160.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Resolves contested claim splits</text><text x="326" y="178.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Weighted consensus median input</text><line x1="542" y1="180" x2="568" y2="180" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow-emerald)" /><rect x="568" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#a855f7" stroke-width="1.0" /><text x="584" y="88" fill="#a855f7" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">TIERS 4 &amp; 5: GENESIS ROOTS</text><rect x="580" y="96.0" width="220" height="222.0" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="580" y="96.0" width="220" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.0" /><text x="596" y="120.0" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">👑</text><text x="620" y="120.0" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Sovereign Root Authority</text><text x="596" y="142.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Genesis cryptographic key custody</text><text x="596" y="160.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Merkle root attestation</text><text x="596" y="178.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Sybil cartel quarantine voting</text>
