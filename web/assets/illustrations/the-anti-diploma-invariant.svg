<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="880" height="380" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <text x="32" y="32" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold" letter-spacing="0.1em">EPISTEMIC GROUNDING PARADIGM</text>
  <text x="32" y="56" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">AUTHORITY CREDENTIALS VS VERBATIM GROUNDING (G = 1.00)</text>

  <!-- Left: The Flawed Authority Model -->
  <rect x="32" y="80" width="395" height="260" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#card-shadow)" />
  <rect x="32" y="80" width="395" height="30" rx="10" fill="rgba(239, 68, 68, 0.15)" />
  <text x="48" y="100" fill="#ef4444" font-size="11" font-family="monospace" font-weight="bold">❌ THE DIPLOMA BIAS (CREDENTIAL-BASED TRUST)</text>
  <text x="48" y="134" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Assumed Trust from Author Diplomas</text>
  <text x="48" y="156" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Accepts claims if author has PhD / prestige byline</text>
  <text x="48" y="176" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Vulnerable to credential fraud &amp; sponsored bias</text>
  <text x="48" y="196" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Blind to factual citations and source verification</text>
  <rect x="48" y="220" width="363" height="100" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.0" />
  <text x="60" y="244" fill="#fca5a5" font-size="10.5" font-family="monospace">Vulnerability: Appeal to False Authority</text>
  <text x="60" y="264" fill="#fca5a5" font-size="10.5" font-family="monospace">Epistemic Risk: HIGH (Unverified claims accepted)</text>
  <text x="60" y="284" fill="#fecaca" font-size="10" font-family="system-ui, sans-serif">Trust resides in the messenger, not the evidence</text>

  <!-- Right: The Credence Invariant Grounding Model -->
  <rect x="453" y="80" width="395" height="260" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" />
  <rect x="453" y="80" width="395" height="30" rx="10" fill="rgba(34, 197, 94, 0.15)" />
  <text x="469" y="100" fill="#22c55e" font-size="11" font-family="monospace" font-weight="bold">🛡️ VERBATIM GROUNDING (G = 1.00 EVIDENCE)</text>
  <text x="469" y="134" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Character-for-Character Forensic Check</text>
  <text x="469" y="156" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Evaluates claims strictly on cited source DOM text</text>
  <text x="469" y="176" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Zero ellipsis masking allowed ($G=1.00$ mandate)</text>
  <text x="469" y="196" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Cryptographic Ed25519 proof over RFC 8785 JSON</text>
  <rect x="469" y="220" width="363" height="100" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.0" />
  <text x="481" y="244" fill="#22c55e" font-size="10.5" font-family="monospace">Standard: The Anti-Diploma Invariant</text>
  <text x="481" y="264" fill="#38bdf8" font-size="10.5" font-family="monospace">Epistemic Guarantee: PRISTINE (0.00% Hallucination)</text>
  <text x="481" y="284" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">Trust resides in verifiable mathematical evidence</text>
</svg>
