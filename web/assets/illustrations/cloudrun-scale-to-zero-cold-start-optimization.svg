    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="bold" letter-spacing="0.1em">COMPUTE LIFECYCLE</text>
  <text x="28" y="50" fill="#f8fafc" font-size="14.5" font-family="sans-serif" font-weight="bold">SCALE-TO-ZERO COLD-BOOT STORAGE HYDRATION CYCLE</text>

  <!-- Elements -->
  <rect x="28" y="96" width="175" height="105" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="28" y="96" width="175" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.2" /><text x="42" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🧊</text><text x="66" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">1. Scale to Zero</text><text x="42" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Idle containers sleep</text><text x="42" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• N=0 compute nodes</text><text x="42" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• $0 idle cost incurred</text><line x1="203" y1="148.5" x2="235" y2="148.5" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="235" y="96" width="175" height="105" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="235" y="96" width="175" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.2" /><text x="249" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚡</text><text x="273" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">2. Request Wakeup</text><text x="249" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Inbound HTTP / MCP</text><text x="249" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cold boot trigger</text><text x="249" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Instance spin-up</text><line x1="410" y1="148.5" x2="442" y2="148.5" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="442" y="96" width="175" height="105" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="442" y="96" width="175" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="456" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">💾</text><text x="480" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">3. GCS Hydration</text><text x="456" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Dual-pointer restore</text><text x="456" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• WAL replay (&lt;1.2s)</text><text x="456" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• SQLite in-memory</text><line x1="617" y1="148.5" x2="649" y2="148.5" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="649" y="96" width="175" height="105" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="649" y="96" width="175" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.2" /><text x="663" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🚀</text><text x="687" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">4. Live Serving</text><text x="663" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• P50 latency &lt; 0.5ms</text><text x="663" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• FastMCP SSE active</text><text x="663" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Snapshot sync</text><rect x="28" y="225" width="804" height="105" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="28" y="225" width="804" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="42" y="248" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="66" y="248" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Dual-Pointer GCS Storage Invariant</text><text x="42" y="268" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Dual-pointer metadata prevents race conditions during cold-start container initialization.</text><text x="42" y="286" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Point-in-time WAL recovery guarantees zero data loss across ephemeral instance lifecycles.</text><text x="42" y="304" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• In-memory cache warming delivers instant sub-millisecond response for repeat domain queries.</text>
</svg>
