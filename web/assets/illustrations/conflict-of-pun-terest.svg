<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="bold" letter-spacing="0.1em">CIVIC CONFLICT OF INTEREST AUDIT</text>
  <text x="28" y="50" fill="#f8fafc" font-size="14.5" font-family="sans-serif" font-weight="bold">MARICOPA LOCAL NEWSROOM VS MUNICIPAL GOVERNANCE AUDIT</text>

  <!-- Elements -->
  <rect x="28" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#ef4444" stroke-width="1.0" /><text x="44" y="88" fill="#ef4444" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">PUBLISHER-POLITICIAN CONFLICT</text><rect x="42" y="96.0" width="356" height="104.0" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="42" y="96.0" width="356" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.0" /><text x="58" y="120.0" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🏛️</text><text x="82" y="120.0" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Municipal News Monopoly</text><text x="58" y="142.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Publisher holds elected council seat</text><text x="58" y="160.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Votes on zoning, contracts &amp; budgets</text><text x="58" y="178.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Directs city&#x27;s sole digital newsroom</text><rect x="42" y="212.0" width="356" height="104.0" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="42" y="212.0" width="356" height="3" rx="1.5" fill="#f59e0b" stroke="none" stroke-width="1.0" /><text x="58" y="236.0" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚠️</text><text x="82" y="236.0" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Epistemic Vulnerabilities</text><text x="58" y="258.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Unlabelled commercial advertorials</text><text x="58" y="276.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Single-source police blotter reliance</text><text x="58" y="294.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Omission of critical civic dissent</text><rect x="448" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#22c55e" stroke-width="1.0" /><text x="464" y="88" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">CREDENCE FORENSIC ATTESTATION (G=1.00)</text><rect x="462" y="96.0" width="356" height="104.0" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="462" y="96.0" width="356" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="478" y="120.0" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔬</text><text x="502" y="120.0" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Verbatim DOM Grounding</text><text x="478" y="142.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Exact quotes from council transcripts</text><text x="478" y="160.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Character-for-character citation check</text><text x="478" y="178.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Deconstructs advertorial camouflage</text><rect x="462" y="212.0" width="356" height="104.0" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="462" y="212.0" width="356" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="478" y="236.0" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="502" y="236.0" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Investigative Safe Harbor</text><text x="478" y="258.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• SPJ-1.6 investigative discourse credit</text><text x="478" y="276.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Exposing bad journalism scores 100.0</text><text x="478" y="294.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Tamper-evident Ed25519 sealed receipt</text><line x1="412" y1="180" x2="448" y2="180" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow-cyan)" />
</svg>
