  <!-- Elements -->
  <rect x="28" y="68" width="804" height="134" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#ef4444" stroke-width="1.1" stroke-dasharray="4 4" /><text x="44" y="88" fill="#ef4444" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">LOCAL NEWSROOM MONOPOLY VS GOVERNANCE COLLISION</text><rect x="48" y="96" width="210" height="86" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="48" y="96" width="210" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.2" /><text x="62" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🏛️</text><text x="86" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Elected Councilmember</text><text x="62" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Holds City Council Seat</text><text x="62" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Directs newsroom policy</text><rect x="324" y="96" width="210" height="86" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="324" y="96" width="210" height="3" rx="1.5" fill="#f59e0b" stroke="none" stroke-width="1.2" /><text x="338" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🗳️</text><text x="362" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Municipal Council Dais</text><text x="338" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Votes on rezoning &amp; contracts</text><text x="338" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Police &amp; public budgets</text><rect x="600" y="96" width="210" height="86" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="600" y="96" width="210" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.2" /><text x="614" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">📰</text><text x="638" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Digital News Outlet</text><text x="614" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• inmaricopa.com publisher</text><text x="614" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Unlabelled advertorials</text><line x1="258" y1="126" x2="324" y2="126" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrow-amber)" /><line x1="534" y1="126" x2="600" y2="126" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow-rose)" /><path d="M 705 182 L 705 194 L 153 194 L 153 182" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-rose)" /><rect x="28" y="216" width="804" height="118" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#22c55e" stroke-width="1.1" /><text x="44" y="236" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">CREDENCE CRYPTOGRAPHIC ATTESTATION LAYER (G=1.00)</text><rect x="48" y="240" width="224" height="76" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="48" y="240" width="224" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.2" /><text x="62" y="263" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">📥</text><text x="86" y="263" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Target Ingestion</text><text x="62" y="283" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Harvester pulls published DOM</text><text x="62" y="301" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Untrusted source container</text><rect x="318" y="240" width="224" height="76" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="318" y="240" width="224" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="332" y="263" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔬</text><text x="356" y="263" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Verbatim Primary Grounding</text><text x="332" y="283" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cross-checks council transcripts</text><text x="332" y="301" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Unmasks advertorial camouflage</text><rect x="586" y="240" width="224" height="76" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="586" y="240" width="224" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.2" /><text x="600" y="263" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔐</text><text x="624" y="263" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Sovereign Attestation</text><text x="600" y="283" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• SPJ-1.6 investigative credit</text><text x="600" y="301" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Ed25519 sealed receipt</text><line x1="272" y1="278" x2="318" y2="278" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow-emerald)" /><line x1="542" y1="278" x2="586" y2="278" strok