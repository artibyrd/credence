  <text x="28" y="28" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="bold" letter-spacing="0.1em">COMPUTE FINOPS</text>
  <text x="28" y="50" fill="#f8fafc" font-size="14.5" font-family="sans-serif" font-weight="bold">DUAL-TIER BICAMERAL INFERENCE ARCHITECTURE</text>

  <!-- Elements -->
  <rect x="28" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#38bdf8" stroke-width="1.1" /><text x="44" y="88" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">TIER 1: FAST HEURISTIC TRIAGE (FREE)</text><rect x="42" y="96" width="356" height="96" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="42" y="96" width="356" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.2" /><text x="56" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚡</text><text x="80" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Local Heuristic Sifter</text><text x="56" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Fast pattern matching (&lt;15ms latency)</text><text x="56" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Filters 83% of routine, uncontested content</text><text x="56" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• $0 API token expense incurred</text><rect x="42" y="204" width="356" height="114" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="42" y="204" width="356" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.2" /><text x="56" y="227" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="80" y="227" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Safety &amp; Ingestion Filters</text><text x="56" y="247" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• SSRF and private IP blocking</text><text x="56" y="265" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Domain reputation index lookup</text><text x="56" y="283" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Poe&#x27;s law satire detection</text><rect x="448" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#22c55e" stroke-width="1.1" /><text x="464" y="88" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">TIER 2: DEEP LLM VERIFICATION (ULTRA)</text><rect x="462" y="96" width="356" height="96" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="462" y="96" width="356" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="476" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🧠</text><text x="500" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Targeted Epistemic Reasoning</text><text x="476" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Invoked strictly for complex, contested claims</text><text x="476" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• 4k thinking budget on core facts</text><text x="476" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Full verbatim grounding checks (G=1.00)</text><rect x="462" y="204" width="356" height="114" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="462" y="204" width="356" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.2" /><text x="476" y="227" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🪙</text><text x="500" y="227" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">83% Compute Cost Slashing</text><text x="476" y="247" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Preserves rate limit quotas under burst loads</text><text x="476" y="265" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Offline circuit breaker headroom buffer</text><text x="476" y="283" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cryptographic Ed25519 attestation seal</text><line x1="412" y1="144" x2="448" y2="144" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow-emerald)" />
</svg>
