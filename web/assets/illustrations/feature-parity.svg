<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="bold" letter-spacing="0.1em">INTERFACE SYMMETRY</text>
  <text x="28" y="50" fill="#f8fafc" font-size="14.5" font-family="sans-serif" font-weight="bold">UNIVERSAL 4-WAY FEATURE PARITY INTERFACE HUB</text>

  <!-- Elements -->
  <rect x="28" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#38bdf8" stroke-width="1.1" /><text x="44" y="88" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">1. INGESTION &amp; SECURITY</text><rect x="40" y="96" width="220" height="100" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="40" y="96" width="220" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.2" /><text x="54" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">📥</text><text x="78" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Network Boundary</text><text x="54" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Target URLs &amp; text payloads</text><text x="54" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• SSRF &amp; metadata IP filter</text><text x="54" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• XML entity injection block</text><rect x="40" y="208" width="220" height="110" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="40" y="208" width="220" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.2" /><text x="54" y="231" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🧹</text><text x="78" y="231" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">DOM Extractor</text><text x="54" y="251" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Strips scripts &amp; styling</text><text x="54" y="269" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Sanitizes HTML elements</text><text x="54" y="287" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Isolates untrusted text</text><rect x="298" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#22c55e" stroke-width="1.1" /><text x="314" y="88" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">2. EPISTEMIC EVALUATION</text><rect x="310" y="96" width="220" height="100" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="310" y="96" width="220" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="324" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🧠</text><text x="348" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Multi-Model Consensus</text><text x="324" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Heuristic claim verification</text><text x="324" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verbatim citations (G=1.00)</text><text x="324" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Circuit breaker headroom</text><rect x="310" y="208" width="220" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="310" y="208" width="220" height="3" rx="1.5" fill="#f59e0b" stroke="none" stroke-width="1.2" /><text x="324" y="231" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚖️</text><text x="348" y="231" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Entropy Defense</text><text x="324" y="251" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Shannon entropy astroturf def</text><text x="324" y="269" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Expertise-weighted medians</text><text x="324" y="287" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Galileo minority rule override</text><rect x="568" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#a855f7" stroke-width="1.1" /><text x="584" y="88" fill="#a855f7" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">3. ATTESTATION &amp; CUSTODY</text><rect x="580" y="96" width="220" height="100" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="580" y="96" width="220" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.2" /><text x="594" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">📜</text><text x="618" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">RFC 8785 Canonical JSON</text><text x="594" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Deterministic serialization</text><text x="594" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• UTF-8 sorted key envelope</text><text x="594" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Tamper-evident byte stream</text><rect x="580" y="208" width="220" height="110" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="580" y="208" width="220" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="594" y="231" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔐</text><text x="618" y="231" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Ed25519 Signature</text><text x="594" y="251" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Genesis root authority sign</text><text x="594" y="269" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• SQLite + vector persistence</text><text x="594" y="287" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Zero-trust verification</text><line x1="272" y1="146" x2="298" y2="146" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><line x1="542" y1="146" x2="568" y2="146" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow-emerald)" />
</svg>
