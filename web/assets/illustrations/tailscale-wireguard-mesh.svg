<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="880" height="380" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <text x="32" y="32" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold" letter-spacing="0.1em">ENCRYPTED OVERLAY TOPOLOGY</text>
  <text x="32" y="56" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">TAILSCALE &amp; WIREGUARD P2P MESH OVERLAY</text>

  <!-- Node 1: Home Lab (NAT) -->
  <rect x="32" y="90" width="240" height="240" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" />
  <rect x="32" y="90" width="240" height="28" rx="10" fill="rgba(56, 189, 248, 0.15)" />
  <text x="48" y="109" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold">🏠 HOMELAB NODE (RESIDENTIAL)</text>
  <text x="48" y="140" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Raspberry Pi 5 / Homelab</text>
  <text x="48" y="162" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Behind symmetric NAT</text>
  <text x="48" y="182" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Zero open public ports</text>
  <text x="48" y="202" fill="#22c55e" font-size="10.5" font-family="monospace">Tailscale IP: 100.64.0.12</text>

  <!-- Center: Encrypted WireGuard Overlay Tunnel -->
  <rect x="304" y="120" width="272" height="180" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#card-shadow)" />
  <text x="320" y="150" fill="#22c55e" font-size="12" font-family="monospace" font-weight="bold">🔒 WIREGUARD OVERLAY</text>
  <text x="320" y="174" fill="#f8fafc" font-size="11.5" font-family="system-ui, sans-serif">ChaCha20-Poly1305 Encryption</text>
  <text x="320" y="196" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• DERP NAT Traversal</text>
  <text x="320" y="216" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• P2P WebSocket Gossip</text>
  <text x="320" y="236" fill="#38bdf8" font-size="10.5" font-family="monospace">Sub-5ms LAN &amp; Cloud Peering</text>

  <!-- Node 2: Google Cloud Run Node -->
  <rect x="608" y="90" width="240" height="240" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" />
  <rect x="608" y="90" width="240" height="28" rx="10" fill="rgba(56, 189, 248, 0.15)" />
  <text x="624" y="109" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold">☁️ CLOUD RUN NODE (PROD)</text>
  <text x="624" y="140" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Google Cloud Platform</text>
  <text x="624" y="162" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Serverless scale-to-zero</text>
  <text x="624" y="182" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Keyless WIF authentication</text>
  <text x="624" y="202" fill="#22c55e" font-size="10.5" font-family="monospace">Tailscale IP: 100.64.0.88</text>
</svg>
