ext x="255" y="156" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">High Write Rate</text><rect x="255" y="222" width="151" height="16" rx="4" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.0" /><text x="330.5" y="234" fill="#60a5fa" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">credence.db-wal</text><rect x="450" y="88" width="175" height="156" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="450" y="88" width="175" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="462" y="109" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">💾</text><text x="484" y="109" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Checkpointing</text><text x="462" y="126" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Periodic WAL Flush</text><text x="462" y="141" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Syncs to Main Database</text><text x="462" y="156" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="normal" text-anchor="start">Zero Data Loss</text><rect x="462" y="222" width="151" height="16" rx="4" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.0" /><text x="537.5" y="234" fill="#22c55e" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">Main Database</text><rect x="657" y="88" width="175" height="156" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="657" y="88" width="175" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.2" /><text x="669" y="109" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🧹</text><text x="691" y="109" fi