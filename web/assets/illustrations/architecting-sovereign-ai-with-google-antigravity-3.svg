  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="bold" letter-spacing="0.1em">MODEL BUDGET &amp; EFFICIENCY</text>
  <text x="28" y="50" fill="#f8fafc" font-size="14.5" font-family="sans-serif" font-weight="bold">MULTI-MODEL PARETO OPTIMIZATION: 4K THINKING SWEET SPOT</text>

  <!-- Elements -->
  <rect x="28" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#22c55e" stroke-width="1.0" /><text x="44" y="88" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">GEMINI 3.7 FLASH (4K THINKING)</text><rect x="42" y="96.0" width="356" height="104.0" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="42" y="96.0" width="356" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="58" y="120.0" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚡</text><text x="82" y="120.0" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Balanced Pareto Peak</text><text x="58" y="142.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• 4,096 thinking tokens default</text><text x="58" y="160.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Resolves satire &amp; Poe&#x27;s law nuances</text><text x="58" y="178.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• 90%+ cost reduction vs flagship models</text><rect x="42" y="212.0" width="356" height="104.0" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="42" y="212.0" width="356" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="58" y="236.0" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="82" y="236.0" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Offline Circuit Breaker</text><text x="58" y="258.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• 30% quota headroom buffer</text><text x="58" y="276.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Graceful fallback without crashing</text><text x="58" y="294.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Hermetic offline execution</text><rect x="448" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#ef4444" stroke-width="1.0" /><text x="464" y="88" fill="#ef4444" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">HEAVYWEIGHT MODELS (CLAUDE / GPT-4O / R1)</text><rect x="462" y="96.0" width="356" height="104.0" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="462" y="96.0" width="356" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.0" /><text x="478" y="120.0" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">💰</text><text x="502" y="120.0" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Flagship Inference Overhead</text><text x="478" y="142.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• 30x higher operational cost</text><text x="478" y="160.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Diminishing returns on structured audits</text><text x="478" y="178.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Latency spikes on high-throughput feeds</text><rect x="462" y="212.0" width="356" height="104.0" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="462" y="212.0" width="356" height="3" rx="1.5" fill="#f59e0b" stroke="none" stroke-width="1.0" /><text x="478" y="236.0" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚖️</text><text x="502" y="236.0" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Budget Governance</text><text x="478" y="258.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Restricted to complex multi-source claims</text><text x="478" y="276.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Controlled by cost optimizer governor</text><text x="478" y="294.0" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Strict token caps on background tasks</text><line x1="412" y1="180" x2="448" y2="180" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow-cyan)" />
</svg>
