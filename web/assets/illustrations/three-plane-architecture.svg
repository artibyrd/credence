l="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="600" text-anchor="start">Genesis Key Custody</text><rect x="721.5" y="265" width="81.5" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#22c55e" stroke-width="0.8" /><text x="762.25" y="278" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">Sovereign</text><text x="614" y="297" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">RFC 8785 Canonical JSON</text><text x="614" y="313" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">Ed25519 root authority</text><line x1="275" y1="125" x2="320" y2="125" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)" /><rect x="263.25" y="109.0" width="68.5" height="16" rx="3" fill="#090d16" stroke="#38bdf8" stroke-width="0.7" /><text x="297.5" y="121.0" fill="#cbd5e1" font-size="9.5" font-family="monospace" font-weight="normal" text-anchor="middle">API / SSE</text><line x1="555" y1="125" x2="600" y2="125" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-cyan)" /><rect x="546.5" y="109.0" width="62.0" height="16" rx="3" fill="#090d16" stroke="#22c55e" stroke-width="0.7" /><text x="577.5" y="121.0" fill="#cbd5e1" font-size="9.5" font-family="monospace" font-weight="normal" text-anchor="middle">WIF Auth</text>
