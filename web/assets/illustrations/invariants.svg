  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="bold" letter-spacing="0.1em">KNOWLEDGE GOVERNANCE</text>
  <text x="28" y="50" fill="#f8fafc" font-size="14.5" font-family="sans-serif" font-weight="bold">THE LIVING INVARIANT CANON &amp; DEMOTION HIGHWAY</text>

  <!-- Elements -->
  <rect x="28" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#ef4444" stroke-width="1.1" /><text x="44" y="88" fill="#ef4444" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">TIER 0: UNIVERSAL CANON</text><rect x="40" y="96" width="220" height="76" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="40" y="96" width="220" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.2" /><text x="54" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🧠</text><text x="78" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">P0 Sovereign Safety</text><text x="54" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Always-on LLM prompt</text><text x="54" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• &lt;800 tokens hard budget</text><text x="54" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Zero speculative code</text><rect x="40" y="184" width="220" height="134" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="40" y="184" width="220" height="3" rx="1.5" fill="#f59e0b" stroke="none" stroke-width="1.2" /><text x="54" y="207" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚖️</text><text x="78" y="207" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Cognitive Canon</text><text x="54" y="227" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Class α: Sovereign Safety</text><text x="54" y="245" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Class β: Lifecycle Topology</text><text x="54" y="263" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Class γ: Interface Symmetry</text><text x="54" y="281" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Strict Mk1 Human Gate</text><rect x="298" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#38bdf8" stroke-width="1.1" /><text x="314" y="88" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">TIER 1: PROGRESSIVE SKILLS</text><rect x="310" y="96" width="220" height="76" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="310" y="96" width="220" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.2" /><text x="324" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">☁️</text><text x="348" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Subsystem Skills</text><text x="324" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Loaded on demand</text><text x="324" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• .agents/skills/*</text><text x="324" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Context economy</text><rect x="310" y="184" width="220" height="134" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="310" y="184" width="220" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.2" /><text x="324" y="207" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🏛️</text><text x="348" y="207" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Specialized Domains</text><text x="324" y="227" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• cloudrun-ops</text><text x="324" y="245" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• mesh-cluster</text><text x="324" y="263" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• white-label-ops</text><text x="324" y="281" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• architecture-governance</text><text x="324" y="299" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• epistemic-benchmark</text><rect x="568" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.4)" stroke="#22c55e" stroke-width="1.1" /><text x="584" y="88" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold" text-anchor="start">TIER 2: SHIFT-LEFT TESTS</text><rect x="580" y="96" width="220" height="76" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="580" y="96" width="220" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="594" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚡</text><text x="618" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Automated QA Gates</text><text x="594" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Local pre-commit QA</text><text x="594" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• &lt;0.3s execution time</text><text x="594" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Immediate feedback</text><rect x="580" y="184" width="220" height="134" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="580" y="184" width="220" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="594" y="207" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="618" y="207" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Mechanical Invariants</text><text x="594" y="227" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Zero-npm invariant</text><text x="594" y="245" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• 7-Manifest parity sync</text><text x="594" y="263" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• 500 LOC ceiling check</text><text x="594" y="281" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Sitemap route coverage</text><text x="594" y="299" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Tiered edge caching</text><line x1="272" y1="134" x2="298" y2="134" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><line x1="542" y1="134" x2="568" y2="134" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow-emerald)" />
</svg>
