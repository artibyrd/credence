<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" letter-spacing="0.1em">EPISTEMIC LENSING</text>
  <text x="28" y="48" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="bold">ARCHITECTURAL BLUEPRINT: THE INFORMATION PYRAMID &amp; EPISTEMIC LENSING</text>

  <!-- Elements -->
  <rect x="250" y="70" width="360" height="70" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="250" y="70" width="360" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="264" y="92" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">⚡</text><text x="286" y="92" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">1. Surface Lens (Glance)</text><text x="264" y="112" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Overall Credence score gauge (0-100)</text><text x="264" y="129" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Quick verified / suspicious badge</text><rect x="150" y="156" width="560" height="74" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="150" y="156" width="560" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="164" y="178" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🔍</text><text x="186" y="178" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">2. Focus Lens (Explore)</text><text x="164" y="198" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Deconstructed claims &amp; deceptive pattern tags</text><text x="164" y="215" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verbatim DOM citations (G=1.00) &amp; sparklines</text><rect x="50" y="246" width="760" height="84" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="50" y="246" width="760" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.0" /><text x="64" y="268" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🔬</text><text x="86" y="268" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">3. Deep Spectrum Lens (Forensic Audit)</text><text x="64" y="288" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cryptographic Ed25519 signatures &amp; RFC 8785 canonical envelopes</text><text x="64" y="305" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Raw DOM SHA-256 hash &amp; full temporal diff timeline</text><line x1="430" y1="140" x2="430" y2="156" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arrow-cyan)" /><line x1="430" y1="230" x2="430" y2="246" stroke="#a855f7" stroke-width="1.4" marker-end="url(#arrow-purple)" />
</svg>
