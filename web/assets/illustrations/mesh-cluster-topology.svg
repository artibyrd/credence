nt-weight="bold" text-anchor="middle">Active</text><text x="249" y="137" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">M=0.92 | f=4</text><rect x="50" y="175" width="155" height="60" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" filter="url(#card-shadow)" /><rect x="50" y="175" width="155" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.0" /><text x="64" y="197" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔬</text><text x="88" y="197" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="600" text-anchor="start">Node 2 (Auditor)</text><rect x="134.0" y="185" width="59.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#60a5fa" stroke-width="0.8" /><text x="163.5" y="198" fill="#60a5fa" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">Active</text><text x="64" y="217" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">M=0.88 | f=4</text><rect x="235" y="175" width="155" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)" /><rect x="235" y="175" width="155" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="249" y="197" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔍</text><text x="273" y="197" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="600" text-anchor="start">Node 3 (Sifter)</text><rect x="319.0" y="185" width="59.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="0.8" /><text x="348.5" y="198" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">Active</text><text x="249" y="217" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">M=0.85 | f=4</text><rect x="142" y="255" width="155" height="60" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" filter="url(#card-shadow)" /><rect x="142" y="255" width="155" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.0" /><text x="156" y="277" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">📰</text><text x="180" y="277" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="600" text-anchor="start">Node 4 (Digest)</text><rect x="226.0" y="265" width="59.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#a855f7" stroke-width="0.8" /><text x="255.5" y="278" fill="#a855f7" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">Active</text><text x="156" y="297" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">M=0.82 | f=4</text><rect x="450" y="60" width="380" height="270" rx="10" fill="rgba(9, 13, 22, 0.75)" stroke="#ef4444" stroke-width="1.0" opacity="0.9" /><rect x="462" y="50" width="350.0" height="20" rx="5" fill="#090d16" stroke="#ef4444" stroke-width="1.0" /><text x="637.0" y="64" fill="#ef4444" font-size="10.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">Byzantine Sybil Cartel Defense (N &gt;= 3f + 1)</text><rect x="470" y="95" width="160" height="60" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" filter="url(#card-shadow)" /><rect x="470" y="95" width="160" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.0" /><text x="484" y="117" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🛑</text><text x="508" y="117" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="600" text-anchor="start">Quarantine Node 9</text><rect x="544.0" y="105" width="74.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#ef4444" stroke-width="0.8" /><text x="581.0" y="118" fill="#ef4444" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">Isolated</text><text x="484" y="137" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">Suspicion: 88.4%</text><rect x="650" y="95" width="160" height="60" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" filter="url(#card-shadow)" /><rect x="650" y="95" width="160" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.0" /><text x="664" y="117" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🛑</text><text x="688" y="117" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="600" text-anchor="start">Quarantine Node 10</text><rect x="724.0" y="105" width="74.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#ef4444" stroke-width="0.8" /><text x="761.0" y="118" fill="#ef4444" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">Isolated</text><text x="664" y="137" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">Suspicion: 92.1%</text><rect x="470" y="175" width="340" height="130" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)" /><rect x="470" y="175" width="340" height="3" rx="1.5" fill="#f59e0b" stroke="none" stroke-width="1.0" /><text x="484" y="197" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">⚖️</text><text x="508" y="197" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="600" text-anchor="start">Consensus Quarantine &amp; Cartel Isolation</text><rect x="694.0" y="185" width="104.0" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#f59e0b" stroke-width="0.8" /><text x="746.0" y="198" fill="#f59e0b" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">Sybil Shield</text><text x="484" y="217" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Watts-Strogatz HRW rendezvous hashing routes feeds.</text><text x="484" y="233" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Nodes with S_j &gt; 70.0% quarantined autonomously.</text><text x="484" y="249" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cartels cannot achieve 3f+1 threshold to skew scores.</text><line x1="410" y1="125" x2="470" y2="125" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-cyan)" /><rect x="402.5" y="109.0" width="75.0" height="16" rx="3" fill="#090d16" stroke="#60a5fa" stroke-width="0.7" /><text x="440.0" y="121.0" fill="#cbd5e1" font-size="9.5" font-family="monospace" font-weight="normal" text-anchor="middle">HRW Gossip</text>
</svg>
