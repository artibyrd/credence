<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="bold" letter-spacing="0.1em">PAIR-PROGRAMMING PARADIGM</text>
  <text x="28" y="50" fill="#f8fafc" font-size="14.5" font-family="sans-serif" font-weight="bold">ANTIGRAVITY 5-STAGE AGENTIC ENGINEERING LIFECYCLE</text>

  <!-- Elements -->
  <rect x="28" y="70" width="180" height="104" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="28" y="70" width="180" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><circle cx="48" cy="94" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" /><text x="48" y="97.5" fill="#38bdf8" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">1</text><text x="66" y="97.5" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Survey</text><text x="42" y="118" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Explore codebase</text><text x="42" y="135" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Zero modifying edits</text><text x="42" y="152" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Formulate approach</text><line x1="208" y1="122.0" x2="236" y2="122.0" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="236" y="70" width="180" height="104" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="236" y="70" width="180" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.0" /><circle cx="256" cy="94" r="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2" /><text x="256" y="97.5" fill="#60a5fa" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">2</text><text x="274" y="97.5" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Plan</text><text x="250" y="118" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Structured plan</text><text x="250" y="135" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Identify invariants</text><text x="250" y="152" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• User feedback check</text><line x1="416" y1="122.0" x2="444" y2="122.0" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="444" y="70" width="180" height="104" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="444" y="70" width="180" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.0" /><circle cx="464" cy="94" r="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" /><text x="464" y="97.5" fill="#a855f7" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">3</text><text x="482" y="97.5" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Execute</text><text x="458" y="118" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Hermetic sandbox</text><text x="458" y="135" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Multi-plane updates</text><text x="458" y="152" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Atomic code edits</text><line x1="624" y1="122.0" x2="652" y2="122.0" stroke="#a855f7" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="652" y="70" width="180" height="104" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="652" y="70" width="180" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><circle cx="672" cy="94" r="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.2" /><text x="672" y="97.5" fill="#22c55e" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">4</text><text x="690" y="97.5" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">QA Gate</text><text x="666" y="118" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• just check gauntlet</text><text x="666" y="135" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• 100% test passing</text><text x="666" y="152" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Mk1 human review</text><rect x="28" y="192" width="804" height="142" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="28" y="192" width="804" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="44" y="216" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">👁️</text><text x="68" y="216" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Human-in-the-Loop Sovereign Authority (Mk1 Eyeball Invariant)</text><text x="44" y="238" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Tags, production deployments, and PR merges require human Mk1 sign-off character-for-character.</text><text x="44" y="256" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• AI agents operate with strict sandbox isolation; out-of-bounds operations require user approval.</text><text x="44" y="274" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Live staging links and passing CI/CD runs are presented before any production promotion.</text>
</svg>
