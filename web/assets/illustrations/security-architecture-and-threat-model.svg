<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="bold" letter-spacing="0.1em">INGESTION PIPELINE</text>
  <text x="28" y="50" fill="#f8fafc" font-size="14.5" font-family="sans-serif" font-weight="bold">UNTRUSTED INGESTION BOUNDARY &amp; SSRF DEFENSE</text>

  <!-- Elements -->
  <rect x="28" y="96" width="175" height="105" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="28" y="96" width="175" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.2" /><text x="42" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">📥</text><text x="66" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">1. Input Boundary</text><text x="42" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Raw URL / text ingest</text><text x="42" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Untrusted source wrap</text><text x="42" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Rate limit checkpoint</text><line x1="203" y1="148.5" x2="235" y2="148.5" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="235" y="96" width="175" height="105" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="235" y="96" width="175" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.2" /><text x="249" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="273" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">2. Network Filter</text><text x="249" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Block 169.254 metadata</text><text x="249" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Reject loopback / private</text><text x="249" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Strip XML entities</text><line x1="410" y1="148.5" x2="442" y2="148.5" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="442" y="96" width="175" height="105" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="442" y="96" width="175" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="456" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🧹</text><text x="480" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">3. DOM Scrubber</text><text x="456" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Strip scripts &amp; styling</text><text x="456" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Clean DOM text tree</text><text x="456" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verbatim citation lock</text><line x1="617" y1="148.5" x2="649" y2="148.5" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="649" y="96" width="175" height="105" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="649" y="96" width="175" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.2" /><text x="663" y="119" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🔐</text><text x="687" y="119" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">4. Signed Attestation</text><text x="663" y="139" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• RFC 8785 Canonical JSON</text><text x="663" y="157" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Ed25519 cryptographic seal</text><text x="663" y="175" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Tamper-evident receipt</text><rect x="28" y="225" width="804" height="105" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3" filter="url(#card-shadow)" /><rect x="28" y="225" width="804" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.2" /><text x="42" y="248" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="66" y="248" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Security Invariant: Socket-Layer SSRF Defense &amp; Epistemic Grounding (G=1.00)</text><text x="42" y="268" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cloud metadata and private subnet ranges are blocked at the socket layer before connection establishment.</text><text x="42" y="286" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Untrusted source text is strictly isolated in XML container tags to prevent prompt injection attacks.</text><text x="42" y="304" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verbatim citations match source text character-for-character, eliminating hallucinated assertions.</text>
</svg>
