<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="bold" letter-spacing="0.1em">NETWORK DEFENSE &amp; DOM SANITIZATION</text>
  <text x="28" y="50" fill="#f8fafc" font-size="14.5" font-family="sans-serif" font-weight="bold">UNTRUSTED INGESTION BOUNDARY &amp; SSRF DEFENSE</text>

  <!-- Elements -->
  <rect x="28" y="70" width="180" height="104" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="28" y="70" width="180" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><circle cx="48" cy="94" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" /><text x="48" y="97.5" fill="#38bdf8" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">1</text><text x="66" y="97.5" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Ingest</text><text x="42" y="118" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Target URL / raw payload</text><text x="42" y="135" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Untrusted source wrap</text><text x="42" y="152" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Request rate limiter</text><line x1="208" y1="122.0" x2="236" y2="122.0" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="236" y="70" width="180" height="104" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="236" y="70" width="180" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.0" /><circle cx="256" cy="94" r="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2" /><text x="256" y="97.5" fill="#60a5fa" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">2</text><text x="274" y="97.5" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Filter</text><text x="250" y="118" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Block 169.254 metadata</text><text x="250" y="135" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Reject private loopbacks</text><text x="250" y="152" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Reject &lt;!ENTITY&gt; / XML</text><line x1="416" y1="122.0" x2="444" y2="122.0" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="444" y="70" width="180" height="104" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="444" y="70" width="180" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.0" /><circle cx="464" cy="94" r="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" /><text x="464" y="97.5" fill="#a855f7" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">3</text><text x="482" y="97.5" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Scrub</text><text x="458" y="118" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Strip scripts &amp; styling</text><text x="458" y="135" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Extract clean text DOM</text><text x="458" y="152" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verbatim exactness G=1.00</text><line x1="624" y1="122.0" x2="652" y2="122.0" stroke="#a855f7" stroke-width="1.6" marker-end="url(#arrow-cyan)" /><rect x="652" y="70" width="180" height="104" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="652" y="70" width="180" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><circle cx="672" cy="94" r="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.2" /><text x="672" y="97.5" fill="#22c55e" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">4</text><text x="690" y="97.5" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Attest</text><text x="666" y="118" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• RFC 8785 Canonical JSON</text><text x="666" y="135" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Ed25519 cryptographic seal</text><text x="666" y="152" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Tamper-evident envelope</text><rect x="28" y="192" width="804" height="142" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="28" y="192" width="804" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="44" y="216" fill="#f8fafc" font-size="15" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="68" y="216" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="start">Security Invariant: Hermetic Defense Against Prompt Injection &amp; Data Exfiltration</text><text x="44" y="238" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• All untrusted input text is strictly isolated in XML container tags before presentation to evaluation models.</text><text x="44" y="256" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cloud metadata endpoints and private IP ranges are rejected at the socket layer prior to network retrieval.</text><text x="44" y="274" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verbatim grounding enforces character-for-character citation matching, eliminating speculative assertions.</text>
</svg>
