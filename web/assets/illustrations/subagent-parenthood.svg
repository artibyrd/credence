<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="880" height="380" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <text x="32" y="32" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold" letter-spacing="0.1em">AGENTIC DELEGATION TOPOLOGY</text>
  <text x="32" y="56" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">SUBAGENT PARENTHOOD &amp; DISCRETE WORKSPACE ISOLATION</text>

  <!-- Parent Orchestrator Node -->
  <rect x="32" y="80" width="360" height="260" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)" />
  <rect x="32" y="80" width="360" height="32" rx="10" fill="rgba(56, 189, 248, 0.15)" />
  <text x="48" y="102" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">👑 PARENT AGENT (ROOT CONTEXT)</text>
  <text x="48" y="134" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Context Window &amp; Invariant Custody</text>
  <text x="48" y="156" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Maintains high-level implementation plan</text>
  <text x="48" y="176" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Protects prompt budget against context bloat</text>
  <text x="48" y="196" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Synthesizes subagent deliverables</text>
  <text x="48" y="216" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Gated Human Review ("Mk1 Eyeball")</text>

  <rect x="48" y="240" width="328" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.0" />
  <text x="60" y="262" fill="#38bdf8" font-size="11" font-family="monospace">invoke_subagent(TypeName, Role, Prompt)</text>
  <text x="60" y="284" fill="#64748b" font-size="10.5" font-family="system-ui, sans-serif">Spawns child tasks into dedicated memory spaces</text>
  <text x="60" y="304" fill="#22c55e" font-size="10.5" font-family="monospace">send_message(ConversationId, Instructions)</text>

  <!-- Connecting Arrows -->
  <line x1="392" y1="140" x2="444" y2="140" stroke="#38bdf8" stroke-width="2.0" marker-end="url(#arrow-sky)" />
  <line x1="392" y1="280" x2="444" y2="280" stroke="#22c55e" stroke-width="2.0" marker-end="url(#arrow-emerald)" />

  <!-- Child Subagent 1: Research -->
  <rect x="450" y="80" width="398" height="122" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" />
  <rect x="450" y="80" width="398" height="26" rx="10" fill="rgba(56, 189, 248, 0.12)" />
  <text x="466" y="98" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold">🔍 RESEARCH SUBAGENT (READ-ONLY)</text>
  <text x="466" y="126" fill="#f8fafc" font-size="11.5" font-family="system-ui, sans-serif" font-weight="500">Broad Codebase &amp; Web Exploration</text>
  <text x="466" y="146" fill="#94a3b8" font-size="10.5" font-family="system-ui, sans-serif">• Surveys 50+ files without polluting parent context</text>
  <text x="466" y="164" fill="#94a3b8" font-size="10.5" font-family="system-ui, sans-serif">• Employs regex grep and web scraping tools</text>
  <text x="466" y="182" fill="#86efac" font-size="10.5" font-family="monospace">Returns structured JSON findings summary</text>

  <!-- Child Subagent 2: Refactor -->
  <rect x="450" y="218" width="398" height="122" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" />
  <rect x="450" y="218" width="398" height="26" rx="10" fill="rgba(34, 197, 94, 0.12)" />
  <text x="466" y="236" fill="#22c55e" font-size="11" font-family="monospace" font-weight="bold">🛠️ REFACTOR SUBAGENT (ISOLATED WORKSPACE)</text>
  <text x="466" y="264" fill="#f8fafc" font-size="11.5" font-family="system-ui, sans-serif" font-weight="500">Hermetic Code Edits &amp; Targeted Tests</text>
  <text x="466" y="284" fill="#94a3b8" font-size="10.5" font-family="system-ui, sans-serif">• Executes isolated module edits in git worktree</text>
  <text x="466" y="302" fill="#94a3b8" font-size="10.5" font-family="system-ui, sans-serif">• Runs unit test gauntlet in ephemeral sandbox</text>
  <text x="466" y="320" fill="#86efac" font-size="10.5" font-family="monospace">Returns clean diff to parent for final Mk1 review</text>
</svg>
