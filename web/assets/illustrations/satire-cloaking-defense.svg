  <text x="28" y="48" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="bold">POE&#x27;S LAW &amp; SATIRE CLOAKING DEFENSE</text>

  <!-- Elements -->
  <rect x="28" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#38bdf8" stroke-width="1.0" /><text x="42" y="86" fill="#38bdf8" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">SATIRE DETECTION (POE&#x27;S LAW)</text><rect x="42" y="94" width="356" height="102" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="42" y="94" width="356" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="56" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🎭</text><text x="78" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Humor &amp; Parody Surface</text><text x="56" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Satirical cues, irony, or farce detected</text><text x="56" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Score safely neutralized (0.00)</text><text x="56" y="170" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Zero false-positive misinformation flags</text><rect x="42" y="208" width="356" height="114" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="42" y="208" width="356" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.0" /><text x="56" y="230" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="78" y="230" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Invariant Guardrail</text><text x="56" y="250" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Protects legitimate comedy and satire from AI censorship</text><text x="56" y="267" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Avoids over-enforcement and algorithmic bias</text><text x="56" y="284" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Grounding exactness preserved character-for-character</text><rect x="448" y="68" width="384" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#ef4444" stroke-width="1.0" /><text x="462" y="86" fill="#ef4444" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">FACTUAL ALLEGATION OVERRIDE (SPJ-1.6)</text><rect x="462" y="94" width="356" height="102" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="462" y="94" width="356" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.0" /><text x="476" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">⚖️</text><text x="498" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Factual Defamation / Claims</text><text x="476" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Specific named entities &amp; financial allegations</text><text x="476" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verified real-world harm potential</text><text x="476" y="170" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• SPJ-1.6 mandatory override active</text><rect x="462" y="208" width="356" height="114" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="462" y="208" width="356" height="3" rx="1.5" fill="#f59e0b" stroke="none" stroke-width="1.0" /><text x="476" y="230" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🔬</text><text x="498" y="230" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Shannon Entropy Defense (H &lt; 0.30)</text><text x="476" y="250" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Low-entropy astroturfing campaigns detected</text><text x="476" y="267" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Forensic audit applied when satire cloaks real attacks</text><text x="476" y="284" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Cryptographic Ed25519 tamper-evident attestation</text><line x1="412" y1="145" x2="448" y2="145" stroke="#ef4444" stroke-width="1.4" marker-end="url(#arrow-rose)" /><text x="430.0" y="139.0" fill="#94a3b8" font-size="9" font-family="monospace" font-weight="normal" text-anchor="middle">Override</text>
</svg>
