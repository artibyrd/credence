<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="880" height="380" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <text x="32" y="32" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold" letter-spacing="0.1em">TOKEN GOVERNANCE &amp; THINKING BUDGETS</text>
  <text x="32" y="56" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">THE 4,000-TOKEN TRANCE VS CALIBRATED REASONING HEADROOM</text>

  <!-- Chart Canvas -->
  <rect x="32" y="80" width="816" height="260" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.0" filter="url(#card-shadow)" />

  <!-- Grid lines -->
  <line x1="80" y1="120" x2="816" y2="120" stroke="#1e293b" stroke-width="1.0" stroke-dasharray="4 4" />
  <line x1="80" y1="180" x2="816" y2="180" stroke="#1e293b" stroke-width="1.0" stroke-dasharray="4 4" />
  <line x1="80" y1="240" x2="816" y2="240" stroke="#1e293b" stroke-width="1.0" stroke-dasharray="4 4" />

  <text x="45" y="124" fill="#ef4444" font-size="10" font-family="monospace">100%</text>
  <text x="45" y="184" fill="#f59e0b" font-size="10" font-family="monospace">70%</text>
  <text x="45" y="244" fill="#22c55e" font-size="10" font-family="monospace">30%</text>

  <!-- Budget Zone 1: Autonomous Crawl -->
  <rect x="80" y="220" width="736" height="80" fill="rgba(34, 197, 94, 0.08)" />
  <text x="100" y="280" fill="#22c55e" font-size="11" font-family="system-ui, sans-serif" font-weight="600">🟢 UNTHROTTLED ZONE (0% – 70%): Continuous Feed Sifting, Gossip, Heuristics</text>

  <!-- Budget Zone 2: Interactive Reserve -->
  <rect x="80" y="150" width="736" height="70" fill="rgba(245, 158, 11, 0.08)" />
  <text x="100" y="175" fill="#f59e0b" font-size="11" font-family="system-ui, sans-serif" font-weight="600">🟡 RESERVED HEADROOM (70% – 100%): Background Tasks Throttle; Interactive Queries Only</text>

  <!-- Budget Zone 3: Circuit Breaker -->
  <rect x="80" y="100" width="736" height="50" fill="rgba(239, 68, 68, 0.12)" />
  <text x="100" y="118" fill="#ef4444" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">🔴 QUOTA_PRESERVED CEILING: Hard Circuit Breaker Tripped (Offline Regex Only)</text>

  <!-- X-Axis -->
  <line x1="80" y1="300" x2="816" y2="300" stroke="#475569" stroke-width="1.5" />
  <text x="120" y="320" fill="#94a3b8" font-size="10" font-family="monospace">00:00 (Hourly Reset)</text>
  <text x="450" y="320" fill="#94a3b8" font-size="10" font-family="monospace">30:00 (Active Sifting)</text>
  <text x="720" y="320" fill="#94a3b8" font-size="10" font-family="monospace">60:00 (100k Token Cap)</text>
</svg>
