  <rect x="28" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#38bdf8" stroke-width="1.0" /><text x="42" y="86" fill="#38bdf8" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">INGESTION &amp; SECURITY</text><rect x="40" y="94" width="220" height="104" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="40" y="94" width="220" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="54" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">📥</text><text x="76" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Network Boundary</text><text x="54" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Target URLs, text &amp; feeds</text><text x="54" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• SSRF &amp; metadata IP filter</text><text x="54" y="170" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• XML entity injection defense</text><text x="54" y="187" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Private subnets blocked</text><rect x="40" y="210" width="220" height="106" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="40" y="210" width="220" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.0" /><text x="54" y="232" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🧹</text><text x="76" y="232" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">DOM Extractor</text><text x="54" y="252" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Strips scripts &amp; styling</text><text x="54" y="269" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Sanitizes HTML elements</text><text x="54" y="286" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Isolates untrusted text</text><text x="54" y="303" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verbatim ground G=1.00</text><rect x="298" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#22c55e" stroke-width="1.0" /><text x="312" y="86" fill="#22c55e" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">EPISTEMIC EVALUATION</text><rect x="310" y="94" width="220" height="104" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="310" y="94" width="220" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="324" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🧠</text><text x="346" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Multi-Model Consensus</text><text x="324" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Heuristic rules &amp; claim check</text><text x="324" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Circuit breaker headroom</text><text x="324" y="170" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Verbatim citation matching</text><text x="324" y="187" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Multi-model Pareto scoring</text><rect x="310" y="210" width="220" height="106" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="310" y="210" width="220" height="3" rx="1.5" fill="#f59e0b" stroke="none" stroke-width="1.0" /><text x="324" y="232" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">⚖️</text><text x="346" y="232" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Entropy Defense</text><text x="324" y="252" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Shannon entropy astroturf def</text><text x="324" y="269" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Expertise-weighted medians</text><text x="324" y="286" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Galileo minority rule override</text><text x="324" y="303" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Poe&#x27;s law satire balance</text><rect x="568" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#a855f7" stroke-width="1.0" /><text x="582" y="86" fill="#a855f7" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">ATTESTATION &amp; STORAGE</text><rect x="580" y="94" width="220" height="104" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="580" y="94" width="220" height="3" rx="1.5" fill="#a855f7" stroke="none" stroke-width="1.0" /><text x="594" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">📜</text><text x="616" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">RFC 8785 Canonical JSON</text><text x="594" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Deterministic serialization</text><text x="594" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• UTF-8 sorted key envelope</text><text x="594" y="170" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Tamper-evident byte stream</text><text x="594" y="187" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• UTC ISO-8601 timestamps</text><rect x="580" y="210" width="220" height="106" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="580" y="210" width="220" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="594" y="232" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🔐</text><text x="616" y="232" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Ed25519 Signature</text><text x="594" y="252" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Genesis root authority sign</text><text x="594" y="269" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• SQLite + vector persistence</text><text x="594" y="286" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Zero-trust verification</text><text x="594" y="303" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Sovereign key custody</text><line x1="272" y1="146" x2="298" y2="146" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arrow-cyan)" /><text x="285.0" y="140.0" fill="#94a3b8" font-size="9" font-family="monospace" font-weight="normal" text-anchor="middle">Sanitized</text><line x1="542" y1="146" x2="568" y2="146" stroke="#22c55e" stroke-width="1.4" marker-end="url(#arrow-emerald)" /><text x="555.0" y="140.0" fill="#94a3b8" font-size="9" font-family="monospace" font-weight="normal" text-anchor="middle