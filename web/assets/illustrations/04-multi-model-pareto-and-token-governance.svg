<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="360" rx="12" fill="url(#obsidian-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.0" />

  <!-- Top Header -->
  <text x="28" y="28" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" letter-spacing="0.1em">KNOWLEDGE GOVERNANCE</text>
  <text x="28" y="48" fill="#f8fafc" font-size="13.5" font-family="sans-serif" font-weight="bold">MULTI-MODEL PARETO OPTIMIZATION: TOKEN SAFETY GOVERNORS &amp; PROMPT ISOLATION</text>

  <!-- Elements -->
  <rect x="28" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#ef4444" stroke-width="1.0" /><text x="42" y="86" fill="#ef4444" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">TIER 0: UNIVERSAL INVARIANTS</text><rect x="40" y="94" width="220" height="76" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="40" y="94" width="220" height="3" rx="1.5" fill="#ef4444" stroke="none" stroke-width="1.0" /><text x="54" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🧠</text><text x="76" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">P0 Sovereign Safety</text><text x="54" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Always-on LLM prompt context</text><text x="54" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• &lt;800 tokens hard ceiling</text><text x="54" y="170" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Zero speculative code</text><rect x="40" y="180" width="220" height="136" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="40" y="180" width="220" height="3" rx="1.5" fill="#f59e0b" stroke="none" stroke-width="1.0" /><text x="54" y="202" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">⚖️</text><text x="76" y="202" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Cognitive Canon</text><text x="54" y="222" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Class α: Safety &amp; Authority</text><text x="54" y="239" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Class β: Lifecycle Topology</text><text x="54" y="256" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Class γ: Interface Symmetry</text><text x="54" y="273" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Strict Mk1 Human Gate</text><rect x="298" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#38bdf8" stroke-width="1.0" /><text x="312" y="86" fill="#38bdf8" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">TIER 1: PROGRESSIVE SKILLS</text><rect x="310" y="94" width="220" height="76" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="310" y="94" width="220" height="3" rx="1.5" fill="#38bdf8" stroke="none" stroke-width="1.0" /><text x="324" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">☁️</text><text x="346" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Subsystem Skills</text><text x="324" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Loaded dynamically on demand</text><text x="324" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• .agents/skills/*</text><text x="324" y="170" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Context economy preserved</text><rect x="310" y="180" width="220" height="136" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="310" y="180" width="220" height="3" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1.0" /><text x="324" y="202" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🏛️</text><text x="346" y="202" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Specialized Domains</text><text x="324" y="222" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• cloudrun-ops</text><text x="324" y="239" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• mesh-cluster</text><text x="324" y="256" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• white-label-ops</text><text x="324" y="273" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• architecture-governance</text><text x="324" y="290" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• epistemic-benchmark</text><rect x="568" y="68" width="244" height="266" rx="10" fill="rgba(15, 23, 42, 0.5)" stroke="#22c55e" stroke-width="1.0" /><text x="582" y="86" fill="#22c55e" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">TIER 2: SHIFT-LEFT TESTS</text><rect x="580" y="94" width="220" height="76" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="580" y="94" width="220" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="594" y="116" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">⚡</text><text x="616" y="116" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Deterministic Tests</text><text x="594" y="136" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Shift-left automated QA</text><text x="594" y="153" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• &lt;0.3s local execution</text><text x="594" y="170" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Immediate feedback loop</text><rect x="580" y="180" width="220" height="136" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" filter="url(#card-shadow)" /><rect x="580" y="180" width="220" height="3" rx="1.5" fill="#22c55e" stroke="none" stroke-width="1.0" /><text x="594" y="202" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="normal" text-anchor="start">🛡️</text><text x="616" y="202" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="start">Mechanical Invariants</text><text x="594" y="222" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Zero-npm invariant</text><text x="594" y="239" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• 7-Manifest parity sync</text><text x="594" y="256" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Code fence validation</text><text x="594" y="273" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Sitemap route coverage</text><text x="594" y="290" fill="#94a3b8" font-size="10.5" font-family="sans-serif" font-weight="normal" text-anchor="start">• Tiered edge caching</text><line x1="272" y1="132" x2="298" y2="132" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arrow-cyan)" /><text x="285.0" y="126.0" fill="#94a3b8" font-size="9" font-family="monospace" font-weight="normal" text-anchor="middle">Graduate</text><line x1="542" y1="132" x2="568" y2="132" stroke="#22c55e" stroke-width="1.4" marker-end="url(#arrow-emerald)" /><text x="555.0" y="126.0" fill="#94a3b8" font-size="9" font-family="monospace" font-weight="normal" text-anchor="middle">Demote</text>
</svg>
