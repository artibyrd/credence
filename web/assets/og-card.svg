<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.5)"/>
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.2)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>

    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="1050" cy="140" r="200" fill="#0284c7" opacity="0.14" filter="url(#glow)"/>
  <circle cx="120" cy="500" r="180" fill="#6366f1" opacity="0.10" filter="url(#glow)"/>

  <!-- Outer Framing Card -->
  <rect x="45" y="45" width="1110" height="540" rx="24" fill="rgba(11, 19, 41, 0.65)" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- Brand Header: Logo + Title -->
  <g transform="translate(95, 95)">
    <!-- Shield Logo Icon -->
    <g transform="translate(0, 0)">
      <path d="M 28 2 L 50 12 L 50 30 C 50 45 28 56 28 56 C 28 56 6 45 6 30 L 6 12 Z" fill="url(#cyan-glow)"/>
      <path d="M 28 7 L 44 15 L 44 30 C 44 41 28 50 28 50 C 28 50 12 41 12 30 L 12 15 Z" fill="#070d1e"/>
      <path d="M 21 28 L 26 33 L 37 21" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Main Title Typography -->
    <text x="68" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#f8fafc" letter-spacing="0.06em">CREDENCE</text>
    
    <!-- Version Badge -->
    <rect x="300" y="15" width="86" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
    <text x="343" y="34" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">v2.18.3</text>
  </g>

  <!-- URL Top Right -->
  <g transform="translate(1060, 134)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="end" letter-spacing="0.04em">credence.run</text>
  </g>

  <!-- Tagline / Mission in Plain English -->
  <g transform="translate(95, 225)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
      Verify Truth on the Web.
    </text>
    <text x="0" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#cyan-glow)" letter-spacing="-0.02em">
      Evidence, Not Algorithms.
    </text>
    
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1" letter-spacing="0.01em">
      Transparent, tamper-proof fact-checking and bias analysis
    </text>
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.01em">
      for news articles, claims, and AI-generated content.
    </text>
  </g>

  <!-- Plain English Feature Badges -->
  <g transform="translate(95, 475)">
    <!-- Pillar 1: Source Grounding -->
    <g transform="translate(0, 0)">
      <rect width="240" height="44" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
      <text x="120" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">
        🔍 Direct Source Evidence
      </text>
    </g>

    <!-- Pillar 2: Tamper Proof -->
    <g transform="translate(260, 0)">
      <rect width="240" height="44" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
      <text x="120" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">
        🛡️ Tamper-Proof Receipts
      </text>
    </g>

    <!-- Pillar 3: Open Standards -->
    <g transform="translate(520, 0)">
      <rect width="240" height="44" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
      <text x="120" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">
        🌐 Decentralized Consensus
      </text>
    </g>

    <!-- Pillar 4: Privacy & Open Web -->
    <g transform="translate(780, 0)">
      <rect width="230" height="44" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
      <text x="115" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">
        ⚡ 100% Open Web
      </text>
    </g>
  </g>
</svg>