<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)"/>
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.2)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>

    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="1050" cy="120" r="180" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="520" r="160" fill="#6366f1" opacity="0.10" filter="url(#glow)"/>

  <!-- Outer Framing Card -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="rgba(15, 23, 42, 0.6)" stroke="url(#card-border)" stroke-width="2"/>

  <!-- Brand Header: Logo + Title -->
  <g transform="translate(90, 95)">
    <!-- Shield Logo Icon -->
    <g transform="translate(0, 5)">
      <path d="M 36 0 L 72 16 L 72 48 C 72 74 36 96 36 96 C 36 96 0 74 0 48 L 0 16 Z" fill="url(#cyan-glow)" opacity="0.95"/>
      <path d="M 36 10 L 62 23 L 62 48 C 62 68 36 84 36 84 C 36 84 10 68 10 48 L 10 23 Z" fill="#0f172a"/>
      <path d="M 26 44 L 33 52 L 48 34" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Main Title Typography -->
    <text x="96" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#f8fafc" letter-spacing="0.08em">CREDENCE</text>
    
    <!-- Version Badge -->
    <rect x="375" y="24" width="92" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="421" y="45" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">v2.10.1</text>
  </g>

  <!-- Tagline / Mission -->
  <g transform="translate(90, 230)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">
      Decentralized Epistemic Verification
    </text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="url(#cyan-glow)" letter-spacing="-0.01em">
      &amp; Sovereign Consensus Network
    </text>
    
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.01em">
      Autonomous news &amp; claim audits with zero hallucinations, RFC 8785 canonical envelopes,
    </text>
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.01em">
      and mathematical Byzantine Sybil resistance across 11 sovereign surfaces.
    </text>
  </g>

  <!-- Feature Pillar Badges -->
  <g transform="translate(90, 470)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect width="235" height="48" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <text x="117" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">
        🛡️ Ed25519 &amp; RFC 8785
      </text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(255, 0)">
      <rect width="235" height="48" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <text x="117" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">
        ⚡ Zero npm • Zero-Build
      </text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(510, 0)">
      <rect width="245" height="48" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <text x="122" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">
        🔍 G=1.00 Verbatim Truth
      </text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(775, 0)">
      <rect width="245" height="48" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <text x="122" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">
        🌐 Byzantine Mesh (3f+1)
      </text>
    </g>
  </g>

  <!-- URL Footer -->
  <g transform="translate(980, 115)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="end" letter-spacing="0.05em">credence.run</text>
  </g>
</svg>