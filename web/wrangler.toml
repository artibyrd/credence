name = "credence"
compatibility_date = "2026-08-17"
main = "_worker.js"

routes = [
  # credence.run zone
  { pattern = "credence.run/*", zone_name = "credence.run" },
  { pattern = "admin.credence.run/*", zone_name = "credence.run" },
  { pattern = "docs.credence.run/*", zone_name = "credence.run" },
  { pattern = "blog.credence.run/*", zone_name = "credence.run" },
  { pattern = "mcp.credence.run/*", zone_name = "credence.run" },
  { pattern = "dev.credence.run/*", zone_name = "credence.run" },
  { pattern = "dev.admin.credence.run/*", zone_name = "credence.run" },
  { pattern = "dev.docs.credence.run/*", zone_name = "credence.run" },
  { pattern = "dev.blog.credence.run/*", zone_name = "credence.run" },
  { pattern = "mcp.dev.credence.run/*", zone_name = "credence.run" },

  # credence.nexus zone
  { pattern = "credence.nexus/*", zone_name = "credence.nexus" },
  { pattern = "dev.credence.nexus/*", zone_name = "credence.nexus" },
  { pattern = "seeds.credence.nexus/*", zone_name = "credence.nexus" },
  { pattern = "dev.seeds.credence.nexus/*", zone_name = "credence.nexus" },

  # credence.foundation zone
  { pattern = "credence.foundation/*", zone_name = "credence.foundation" },
  { pattern = "dev.credence.foundation/*", zone_name = "credence.foundation" },
  { pattern = "keys.credence.foundation/*", zone_name = "credence.foundation" },
  { pattern = "dev.keys.credence.foundation/*", zone_name = "credence.foundation" },

  # credence.report zone
  { pattern = "credence.report/*", zone_name = "credence.report" },
  { pattern = "dev.credence.report/*", zone_name = "credence.report" }
]

[assets]
directory = "."
binding = "ASSETS"

[vars]
PROD_BACKEND_URL = "https://credence-server-psgqr4nwoq-uc.a.run.app"
DEV_BACKEND_URL = "https://credence-dev-wukzqiyqbq-uc.a.run.app"

[env.production.vars]
PROD_BACKEND_URL = "https://credence-server-psgqr4nwoq-uc.a.run.app"
DEV_BACKEND_URL = "https://credence-dev-wukzqiyqbq-uc.a.run.app"

[env.dev.vars]
PROD_BACKEND_URL = "https://credence-server-psgqr4nwoq-uc.a.run.app"
DEV_BACKEND_URL = "https://credence-dev-wukzqiyqbq-uc.a.run.app"
